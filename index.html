const SLOT_LABELS = { plan:'매장근무계획관리', attend:'근태관리', leave:'연차신청현황', match:'매장·매니저 매칭' };
const SLOT_PARSERS = { plan: tryParsePlan, attend: tryParseAttend, leave: tryParseLeave, match: tryParseMatch };

function showToast(msg, type){
  let host = document.getElementById('toastHost');
  if (!host){
    host = document.createElement('div');
    host.id = 'toastHost';
    host.style.cssText = 'position:fixed; top:76px; right:20px; z-index:400; display:flex; flex-direction:column; gap:8px; max-width:360px;';
    document.body.appendChild(host);
  }
  const div = document.createElement('div');
  div.className = 'notice ' + (type==='warn' ? 'notice-warn' : 'notice-info');
  div.style.boxShadow = 'var(--shadow)';
  div.innerHTML = msg;
  host.appendChild(div);
  setTimeout(()=>{ if(host.contains(div)) div.remove(); }, 6000);
}

function showNotice(msg, type){
  const box = document.getElementById('uploadNotices');
  if (!box || box.offsetParent === null){ showToast(msg, type); return; }
  const div = document.createElement('div');
  div.className = 'notice ' + (type==='warn' ? 'notice-warn' : 'notice-info');
  div.innerHTML = msg;
  box.innerHTML = '';
  box.appendChild(div);
  setTimeout(()=>{ if(box.contains(div)) div.remove(); }, 6000);
}

async function handleFile(file, requestedSlot){
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    // try requested slot's parser first, then fall back to auto-detect across all parsers
    let slot = requestedSlot;
    let parsed = SLOT_PARSERS[slot](wb);
    if (!parsed){
      for (const s of ['plan','attend','leave','match']){
        if (s === requestedSlot) continue;
        const p = SLOT_PARSERS[s](wb);
        if (p){ slot = s; parsed = p; break; }
      }
    }
    if (!parsed){
      showNotice(`<b>${escapeHtml(file.name)}</b> 파일에서 알아볼 수 있는 표 구조를 찾지 못했습니다. 파일 내용을 확인해주세요.`, 'warn');
      return;
    }
    FILES[slot] = { file, name: file.name, parsed };
    if (slot !== requestedSlot){
      showNotice(`<b>${escapeHtml(file.name)}</b> 파일은 <b>${SLOT_LABELS[requestedSlot]}</b> 칸에 넣으셨지만, 내용상 <b>${SLOT_LABELS[slot]}</b> 데이터로 인식되어 해당 칸에 자동 배치했습니다.`, 'info');
    }
    updateUploadUI();
  } catch(err){
    console.error(err);
    showNotice(`<b>${escapeHtml(file.name)}</b> 파일을 읽는 중 오류가 발생했습니다: ${escapeHtml(err.message||err)}`, 'warn');
  }
}

function updateUploadUI(){
  ['plan','attend','leave'].forEach(slot => {
    const card = document.getElementById('card-'+slot);
    const statusEl = card.querySelector('.uc-status');
    const fnameEl = statusEl.querySelector('.fname');
    if (FILES[slot]){
      card.classList.add('filled');
      fnameEl.textContent = FILES[slot].name;
    } else {
      card.classList.remove('filled');
      fnameEl.textContent = '파일을 선택하거나 끌어다 놓으세요';
    }
  });

  // 매장/매니저 매칭 파일은 이전에 저장된 데이터가 있으면 이번 실행에서 생략할 수 있다.
  const matchCard = document.getElementById('card-match');
  const matchStatusEl = matchCard.querySelector('.uc-status');
  const matchFnameEl = matchStatusEl.querySelector('.fname');
  if (FILES.match){
    matchCard.classList.add('filled');
    matchFnameEl.textContent = `${FILES.match.name} (이번 실행에 새로 반영)`;
  } else if (CACHED_MATCH_DATA){
    matchCard.classList.add('filled');
    matchFnameEl.textContent = '기존 저장된 매칭 데이터 사용 중 (새 파일 업로드 시에만 갱신)';
  } else {
    matchCard.classList.remove('filled');
    matchFnameEl.textContent = '파일을 선택하거나 끌어다 놓으세요';
  }

  const allSet = ['plan','attend','leave'].every(s => FILES[s]) && (FILES.match || CACHED_MATCH_DATA);
  document.getElementById('runBtn').disabled = !allSet;
  document.getElementById('runHint').textContent = allSet
    ? '모든 파일이 준비되었습니다. 분석을 실행하세요.'
    : (CACHED_MATCH_DATA
        ? '근무계획·근태관리·연차신청 3개 파일을 업로드하면 실행할 수 있습니다. (매칭 파일은 기존 데이터 사용)'
        : '4개 파일을 모두 업로드하면 실행할 수 있습니다.');
}

function initUpload(){
  document.querySelectorAll('.upload-card input[type=file]').forEach(input => {
    input.addEventListener('change', e => {
      const f = e.target.files[0];
      if (f) handleFile(f, input.dataset.slot);
      e.target.value = '';
    });
  });
  document.querySelectorAll('.upload-card').forEach(card => {
    card.addEventListener('dragover', e => { e.preventDefault(); card.style.borderColor = 'var(--accent)'; });
    card.addEventListener('dragleave', e => { card.style.borderColor = ''; });
    card.addEventListener('drop', e => {
      e.preventDefault();
      card.style.borderColor = '';
      const f = e.dataTransfer.files[0];
      if (f) handleFile(f, card.dataset.slot);
    });
  });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => { if (!e.target.closest('.upload-card')) e.preventDefault(); });

  document.getElementById('resetBtn').addEventListener('click', () => {
    ['plan','attend','leave','match'].forEach(s => FILES[s]=null);
    updateUploadUI();
    showNotice('업로드 칸을 초기화했습니다. (저장된 매칭 데이터는 유지됩니다)', 'info');
  });

  document.getElementById('runBtn').addEventListener('click', runAnalysis);
}

function runAnalysis(){
  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  btn.textContent = '분석 중…';
  setTimeout(async () => {
    try {
      const matchData = FILES.match ? FILES.match.parsed : CACHED_MATCH_DATA;
      if (!matchData){
        alert('매장/매니저 매칭 파일이 필요합니다. 최초 1회는 반드시 업로드해주세요.');
        return;
      }
      if (FILES.match) CACHED_MATCH_DATA = FILES.match.parsed; // only replace when a new file was uploaded
      ANALYSIS = buildAnalysis(FILES.plan.parsed, FILES.attend.parsed, FILES.leave.parsed, matchData);

      const now = new Date().toISOString();
      ['plan','attend','leave'].forEach(slot => { FILE_META[slot] = { name: FILES[slot].name, updatedAt: now }; });
      if (FILES.match) FILE_META.match = { name: FILES.match.name, updatedAt: now };
      else if (!FILE_META.match) FILE_META.match = { name: '(기존 저장된 매칭 데이터)', updatedAt: now };

      document.getElementById('uploadSection').style.display = 'none';
      document.getElementById('resultSection').style.display = 'block';
      renderTopbarActions();
      renderAll();
      window.scrollTo({top:0, behavior:'smooth'});
      await saveSharedData(true);
      showFileMetaModal(true);
    } catch(err){
      console.error(err);
      alert('분석 중 오류가 발생했습니다: ' + (err.message||err));
    } finally {
      btn.disabled = false;
      btn.textContent = '근태 분석 실행 →';
    }
  }, 30);
}

function serializeMatchData(md){
  if (!md) return null;
  return {
    storeEntries: Array.from(md.storeMap.entries()),
    codeEntries: md.codeMap ? Array.from(md.codeMap.entries()) : [],
    storeList: md.storeList, sheetName: md.sheetName,
  };
}
function deserializeMatchData(obj){
  if (!obj) return null;
  return {
    storeMap: new Map(obj.storeEntries),
    codeMap: new Map(obj.codeEntries||[]),
    storeList: obj.storeList, sheetName: obj.sheetName,
  };
}

async function loadSharedData(){
  if (!STORAGE_AVAILABLE) return false;
  try {
    const res = await window.storage.get(SHARED_KEY, true);
    if (!res || !res.value) return false;
    const payload = JSON.parse(res.value);
    if (!payload || !payload.analysis) return false;
    ANALYSIS = payload.analysis;
    SAVED_META = { savedAt: payload.savedAt };
    QUOTAS = payload.quotas || {};
    CACHED_MATCH_DATA = deserializeMatchData(payload.matchData);
    FILE_META = payload.fileMeta || FILE_META;
    return true;
  } catch(err){
    return false; // key not present yet, or storage not usable here
  }
}

async function saveSharedData(quiet){
  if (!STORAGE_AVAILABLE){
    showNotice('이 화면은 저장소 공유 기능이 없는 환경(로컬로 열린 파일 등)에서 실행 중입니다. Claude.ai에서 이 아티팩트를 열고 게시(Publish)해야 담당자들과 URL을 공유할 수 있습니다.', 'warn');
    return false;
  }
  try {
    const savedAt = new Date().toISOString();
    await window.storage.set(SHARED_KEY, JSON.stringify({
      analysis: ANALYSIS, savedAt, quotas: QUOTAS, matchData: serializeMatchData(CACHED_MATCH_DATA), fileMeta: FILE_META,
    }), true);
    SAVED_META = { savedAt };
    renderTopbarActions();
    if (!quiet) showNotice('공유 저장이 완료되었습니다. 같은 링크로 접속하는 담당자들에게 이 결과가 표시됩니다.', 'info');
    return true;
  } catch(err){
    console.error(err);
    showNotice('공유 저장 중 오류가 발생했습니다: ' + (err.message||err), 'warn');
    return false;
  }
}

/* =========================================================================
   ANALYSIS BUILDER
   ========================================================================= */
function judgeDay(planCode, hasActual, leaveEntries, isFuture){
  const code = (planCode||'').trim();
  const isWork = WORK_CODES.includes(code);
  const isEdu  = EDU_CODES.includes(code);
  const isOff  = OFF_CODES.includes(code);
  const isLeave= LEAVE_CODES.includes(code);
  const hasLeaveReq = leaveEntries && leaveEntries.length > 0;
  const leaveHasApproved = hasLeaveReq && leaveEntries.some(e=>e.status==='승인');

  if (isWork || isEdu){
    if (hasActual) return isEdu ? 'work_ok_edu' : 'work_ok';
    if (isFuture) return 'future';
    if (hasLeaveReq) return leaveHasApproved ? 'leave_not_reflected' : 'leave_pending';
    return 'absent_unauth';
  }
  if (isOff){
    if (hasActual) return 'off_but_worked';
    if (isFuture) return 'future';
    return 'off_ok';
  }
  if (isLeave){
    if (hasLeaveReq) return leaveHasApproved ? 'leave_ok' : 'leave_pending';
    if (isFuture) return 'future';
    return 'leave_unmatched';
  }
  // blank / unknown code
  if (isFuture) return 'future';
  if (hasActual) return 'work_ok'; // worked despite no schedule entry
  if (hasLeaveReq) return leaveHasApproved ? 'leave_ok' : 'leave_pending';
  return 'no_schedule';
}

function buildAnalysis(planData, attendData, leaveData, matchData){
  // 1. determine year / month / cutoff from attendance max date
  const maxDateStr = attendData.maxDateStr || '';
  let year, month, cutoffIso;
  if (maxDateStr.length === 8){
    year = parseInt(maxDateStr.slice(0,4),10);
    month = parseInt(maxDateStr.slice(4,6),10);
    cutoffIso = `${year}-${pad2(month)}-${maxDateStr.slice(6,8)}`;
  } else {
    const now = new Date();
    year = now.getFullYear(); month = now.getMonth()+1;
    cutoffIso = `${year}-${pad2(month)}-${pad2(now.getDate())}`;
  }
  const daysInMonth = new Date(year, month, 0).getDate();
  const maxDay = Math.min(planData.maxDay || daysInMonth, daysInMonth);
  const cutoffDay = parseInt(maxDateStr.slice(6,8),10) || daysInMonth;

  const unmatchedStores = new Set();
  const employees = [];
  const dayMatrix = []; // flat list of every employee-day record
  const anomalies = [];
  const excludedByRoute = { 홈플러스:0, 코스트코:0, 기타:0 };

  const TARGET_ROUTE = '전자랜드';
  const EXCLUDE_ROUTES = ['홈플러스','코스트코'];

  for (const emp of planData.employees){
    // 1순위: 근태관리 출근지점의 매장코드 접두번호로 매칭 (가장 신뢰도 높음 — 매장명 표기
    // 차이와 무관하게 매장매칭 파일의 매장코드와 직접 대조). 실패하면 매장명 유사매칭으로 보완.
    const empCode = attendData.codeBySabun ? attendData.codeBySabun.get(emp.sabun) : null;
    let orgInfo = (empCode && matchData.codeMap) ? matchData.codeMap.get(empCode) : null;
    if (!orgInfo) orgInfo = resolveStore(emp.store, matchData);
    if (!orgInfo) unmatchedStores.add(emp.store);

    // scope: this analyzer covers 전자랜드 counselors only. Stores confirmed to be
    // another channel (홈플러스/코스트코) are excluded; unmatched stores are kept
    // (with route blank) so matching problems stay visible rather than silently vanishing.
    if (orgInfo && EXCLUDE_ROUTES.includes(orgInfo.route)){
      excludedByRoute[orgInfo.route] = (excludedByRoute[orgInfo.route]||0) + 1;
      continue;
    }

    const empOut = {
      sabun: emp.sabun, name: emp.name, store: emp.store, status: emp.status,
      route: orgInfo ? orgInfo.route : '', region: orgInfo ? orgInfo.region : '',
      area: orgInfo ? orgInfo.area : '',
      regionHead: orgInfo ? orgInfo.regionHead : '미매칭',
      manager: orgInfo ? orgInfo.manager : '미매칭',
      days: [],
      counts: {},
      usage: { annualUsed: 0, offUsed: 0, substituteUsed: 0, subBreakdown: { sub: 0, comp: 0 } },
    };

    // 휴무/대체휴무/연차 사용일수는 아래 일자별 루프에서 "실제로 쉰 날"(판정 결과) 기준으로
    // 집계한다 — 스케줄 입력 개수를 그대로 세지 않고, 스케줄상 대체휴무인 날 실제 결근으로
    // 찍혀도 승인된 대체휴무 신청이 있으면 대체휴무 사용으로 반영한다. 대체휴무 한도 비교용
    // 합계(substituteUsed)는 대체휴일+보상휴가를 합산하되, 표시용으로 각각도 따로 기록한다.

    for (let d=1; d<=maxDay; d++){
      const dateStr = dateStrFromParts(year, month, d);
      const iso = isoFromParts(year, month, d);
      const planCode = emp.dailyPlan[d] || '';
      const actualRec = attendData.byKey.get(emp.sabun+'|'+dateStr) || null;
      const leaveEntries = leaveData.dateMap.get(emp.sabun+'|'+iso) || [];
      const isFuture = d > cutoffDay;
      const judgement = judgeDay(planCode, !!actualRec, leaveEntries, isFuture);
      const weekday = WEEKDAYS_KR[isoToDateObj(iso).getDay()];

      // usage tallies — based on the judged outcome, not the raw schedule code:
      // a day scheduled 휴무/대체휴무 only "counts" as used if the person actually
      // stayed off (judgement === off_ok); if they worked anyway (off_but_worked)
      // it wasn't really used. Conversely, if the schedule still says 근무 but the
      // person has an approved 대체휴무 request covering this day and never clocked
      // in (i.e. it would otherwise show as 결근), treat it as 대체휴무 used instead.
      if (!isFuture){
        const c = (planCode||'').trim();
        if (c === '연차') empOut.usage.annualUsed += 1;
        else if (c === '오전반차' || c === '오후반차') empOut.usage.annualUsed += 0.5;
        else if (c === '휴무'){
          if (judgement === 'off_ok') empOut.usage.offUsed += 1;
        } else if (c === '대체휴일(1일)'){
          if (judgement === 'off_ok'){ empOut.usage.substituteUsed += 1; empOut.usage.subBreakdown.sub += 1; }
        } else if (c === '보상휴가(1일)'){
          if (judgement === 'off_ok'){ empOut.usage.substituteUsed += 1; empOut.usage.subBreakdown.comp += 1; }
        } else if (c === '대체휴일(0.5일)'){
          if (judgement === 'off_ok'){ empOut.usage.substituteUsed += 0.5; empOut.usage.subBreakdown.sub += 0.5; }
        } else if (c === '보상휴가(0.5일)'){
          if (judgement === 'off_ok'){ empOut.usage.substituteUsed += 0.5; empOut.usage.subBreakdown.comp += 0.5; }
        } else if (!actualRec && leaveEntries.some(le => le.status==='승인' && (le.kind||'').includes('대체'))){
          // schedule wasn't updated to show the substitute day off, but there is an
          // approved 대체휴무 request and no clock-in — count it as used, not absent.
          empOut.usage.substituteUsed += 1;
          empOut.usage.subBreakdown.sub += 1;
        }
      }

      const dayRec = {
        day:d, dateStr, iso, weekday, planCode,
        actual: actualRec, leaveEntries, judgement
      };
      empOut.days.push(dayRec);
      empOut.counts[judgement] = (empOut.counts[judgement]||0) + 1;

      const flat = {
        sabun: emp.sabun, name: emp.name, store: emp.store,
        route: empOut.route, region: empOut.region, area: empOut.area,
        regionHead: empOut.regionHead, manager: empOut.manager,
        date: iso, weekday, planCode,
        actualIn: actualRec ? (actualRec.inTime||actualRec.inTimeChg||'') : '',
        actualOut: actualRec ? (actualRec.outTime||actualRec.outTimeChg||'') : '',
        actualPlace: actualRec ? actualRec.inPlace : '',
        leaveStatus: leaveEntries.map(e=>e.status).join(','),
        leaveKind: leaveEntries.map(e=>e.kind).join(','),
        judgement, judgementLabel: STATUS_META[judgement].label,
      };
      dayMatrix.push(flat);
      if (STATUS_META[judgement].severity >= 1){
        anomalies.push(flat);
      }
    }
    employees.push(empOut);
  }

  // employees referenced in attendance/leave but missing from plan roster
  const planSabuns = new Set(planData.employees.map(e=>e.sabun));
  const ghostSabuns = new Set();
  attendData.records.forEach(r => { if (!planSabuns.has(r.sabun)) ghostSabuns.add(r.sabun+'|'+r.name); });
  leaveData.kept.forEach(r => { if (!planSabuns.has(r.sabun)) ghostSabuns.add(r.sabun+'|'+r.name); });

  // leave requests enriched with org info + schedule reflection check
  // (scoped to 전자랜드 counselors only — leave requests from excluded-channel
  // staff, or staff missing from the schedule roster entirely, are dropped here)
  const leaveEnrichedAll = leaveData.kept.map(entry => {
    const emp = employees.find(e => e.sabun === entry.sabun);
    let reflected = '확인불가';
    if (emp){
      let cur = entry.start; let allReflected = true; let any = false; let guard=0;
      while (cur <= entry.end && guard < 60){
        const dObj = isoToDateObj(cur);
        if (dObj.getFullYear()===year && dObj.getMonth()+1===month){
          any = true;
          const dayNum = dObj.getDate();
          const dayRec = emp.days.find(x=>x.day===dayNum);
          const code = dayRec ? dayRec.planCode : '';
          const kindMatches = LEAVE_CODES.includes(code) || OFF_CODES.includes(code);
          if (!kindMatches) allReflected = false;
        }
        cur = isoAddDays(cur,1); guard++;
      }
      reflected = any ? (allReflected ? '반영됨' : '미반영') : '해당월아님';
    }
    return Object.assign({}, entry, {
      store: emp?emp.store:'', route: emp?emp.route:'', regionHead: emp?emp.regionHead:'', manager: emp?emp.manager:'',
      reflected, inScope: !!emp
    });
  });
  const leaveEnriched = leaveEnrichedAll.filter(x => x.inScope);
  const leaveOutOfScope = leaveEnrichedAll.filter(x => !x.inScope).length;

  // same requests broken out one row per calendar day in range (for day-by-day display)
  const leaveDaily = [];
  leaveEnriched.forEach(entry => {
    let cur = entry.start; let guard = 0;
    const numDays = Math.max(1, Math.round((isoToDateObj(entry.end) - isoToDateObj(entry.start)) / 86400000) + 1);
    const amountNum = parseFloat(entry.amount);
    const perDay = (!isNaN(amountNum) && numDays > 0) ? (amountNum / numDays) : entry.amount;
    while (cur <= entry.end && guard < 60){
      const dObj = isoToDateObj(cur);
      leaveDaily.push(Object.assign({}, entry, {
        date: cur, weekday: WEEKDAYS_KR[dObj.getDay()],
        perDayAmount: (!isNaN(amountNum) && numDays > 0) ? (Math.round(perDay*10)/10) : perDay,
      }));
      cur = isoAddDays(cur,1); guard++;
    }
  });

  // 매장매칭 파일 기준 "전자랜드" 매장 수 — 매장명이 아닌 매장코드(codeMap)로 집계해야
  // 채널간 동명 매장(예: "작전점"이 전자랜드/홈플러스에 각각 존재)에서 누락되지 않는다.
  // 폐점 매장은 현재 운영 매장수에서 제외한다.
  const storeCountByArea = new Map();
  let totalElectrolandStores = 0;
  if (matchData.codeMap){
    matchData.codeMap.forEach(info => {
      if (info.route !== '전자랜드') return;
      if (info.closedDate) return;
      totalElectrolandStores++;
      const key = info.area || '미분류';
      storeCountByArea.set(key, (storeCountByArea.get(key)||0) + 1);
    });
  }

  return {
    year, month, daysInMonth, maxDay, cutoffDay, cutoffIso,
    employees, dayMatrix, anomalies, leaveEnriched, leaveDaily, leaveOutOfScope,
    leaveDropped: leaveData.dropped,
    unmatchedStores: Array.from(unmatchedStores),
    ghostSabuns: Array.from(ghostSabuns),
    excludedByRoute,
    storeCountByArea: Object.fromEntries(storeCountByArea),
    totalElectrolandStores,
    planSheet: planData.sheetName, attendSheet: attendData.sheetName,
    leaveSheet: leaveData.sheetName, matchSheet: matchData.sheetName,
    totalLeaveAll: leaveData.all.length, totalLeaveKept: leaveData.kept.length,
  };
}

// Manual overrides for known store-name mismatches between the schedule file
// and the store/manager matching file (confirmed by the user).
const STORE_ALIASES = {
  '현대시티아울렛': '현대아울렛 가산점',
  '둔산점': '대전본점',
  '가든5점': '현대아울렛 가든파이브점',
  '광산점': '광주하남점',
  '현대시티아울렛대구': '현대아울렛 대구점',
  '대전현대아울렛': '현대프리미엄아울렛 대전점',
};

function resolveStore(planStoreName, matchData){
  if (!matchData) return null;
  const norm = normName(planStoreName);
  if (!norm) return null;

  const aliasKey = Object.keys(STORE_ALIASES).find(k => normName(k) === norm);
  if (aliasKey){
    const target = normName(STORE_ALIASES[aliasKey]);
    if (matchData.storeMap.has(target)) return matchData.storeMap.get(target);
  }

  if (matchData.storeMap.has(norm)) return matchData.storeMap.get(norm);

  const stripJeom = s => s.replace(/점$/, '');
  const nameCore = stripJeom(norm);
  const spaceTokens = String(planStoreName||'').trim().split(/\s+/)
    .map(t => stripJeom(normName(t)))
    .filter(t => t.length >= 2);
  // all-length-2+ split pairs of the un-spaced name (covers names typed without a space, e.g. "김포현대")
  const splitPairs = [];
  if (nameCore.length >= 4){
    for (let i=2; i<=nameCore.length-2; i++){
      splitPairs.push([nameCore.slice(0,i), nameCore.slice(i)]);
    }
  }

  let bestScore = Infinity;
  let candidates = [];
  for (const sn of matchData.storeList){
    const nsn = normName(sn);
    if (nsn.length < 2) continue;
    const candCore = stripJeom(nsn);
    let score = Infinity;

    if (nsn.includes(norm) || norm.includes(nsn)){
      score = 1; // full containment either direction
    } else if (spaceTokens.length >= 2 && spaceTokens.every(t => candCore.includes(t))){
      score = 2; // every space-separated word appears in the candidate
    } else if (splitPairs.some(([p1,p2]) => candCore.includes(p1) && candCore.includes(p2))){
      score = 3; // the name splits into two known parts, both present in the candidate
    } else if (nameCore.length >= 2 && candCore.length >= 2 &&
               (candCore.startsWith(nameCore) || nameCore.startsWith(candCore))){
      score = 4; // shared prefix (weakest signal)
    }

    if (score < Infinity){
      if (score < bestScore){ bestScore = score; candidates = [sn]; }
      else if (score === bestScore){ candidates.push(sn); }
    }
  }

  if (candidates.length === 1) return matchData.storeMap.get(normName(candidates[0]));
  if (candidates.length > 1){
    // tie-break: prefer the shortest candidate name (closest length to the source)
    candidates.sort((x,y) => normName(x).length - normName(y).length);
    const top = candidates[0];
    const secondLen = candidates[1] ? normName(candidates[1]).length : Infinity;
    if (normName(top).length < secondLen) return matchData.storeMap.get(normName(top));
    return null; // genuinely ambiguous — leave unmatched rather than risk a wrong assignment
  }
  return null;
}
