<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제니엘 전자랜드 상담사 근태 점검 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#10192B;
  --ink-soft:#33415A;
  --paper:#E3E8E9;
  --panel:#FFFFFF;
  --line:#D6DCDD;
  --line-soft:#E6EAEA;
  --accent:#0B3B8C;
  --accent-soft:#DCE6F7;
  --accent2:#F2924B;
  --accent2-soft:#FCE8D6;
  --amber:#FFB12D;
  --amber-soft:#FCEED0;
  --danger:#E15A50;
  --danger-soft:#FBE1DE;
  --purple:#8A7EEF;
  --purple-soft:#E9E6FC;
  --teal:#03C3B2;
  --teal-soft:#D7F4F0;
  --brand-green:#14A45E;
  --brand-green-soft:#DFF4E9;
  --muted:#5B6B7D;
  --radius:10px;
  --shadow: 0 1px 2px rgba(16,25,43,0.06), 0 8px 24px -12px rgba(16,25,43,0.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono', monospace;}
h1,h2,h3,.display{font-family:'Space Grotesk','IBM Plex Sans KR',sans-serif;}
::selection{background:var(--accent-soft);}

/* ---------- Header ---------- */
header.topbar{
  background:#FFFFFF;
  color:var(--ink);
  padding:16px 30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  z-index:50;
  border-bottom:2px solid var(--brand-green);
  box-shadow:0 2px 14px -6px rgba(16,25,43,0.10);
}
.brand{display:flex; align-items:center; gap:16px;}
.brand-logo{height:42px; width:auto; display:block; flex:none;}
.brand-div{width:1px; height:34px; background:var(--line); flex:none;}
.brand-title-row{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
.brand-slogan-badge{
  font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:0.2px;
  color:var(--brand-green); background:var(--brand-green-soft); padding:3px 9px; border-radius:99px;
  white-space:nowrap;
}
.brand-text h1{font-size:18px; margin:0; font-weight:700; letter-spacing:-0.2px; color:var(--ink);}
.brand-text p{margin:2px 0 0; font-size:11.5px; color:var(--muted); letter-spacing:0.15px;}
.topbar-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.badge{
  display:inline-flex; align-items:center; gap:6px;
  background:#F3F5F1; border:1px solid var(--line);
  color:var(--ink-soft); font-size:11.5px; padding:6px 11px; border-radius:99px;
  font-family:'IBM Plex Mono',monospace;
}
.badge b{color:var(--ink); font-weight:700;}

button{font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
a, .tab-btn, .btn, .quota-input, input, select{-webkit-tap-highlight-color:transparent;}
.btn{
  border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600;
  display:inline-flex; align-items:center; gap:7px; transition:transform .12s ease, opacity .12s ease, background .15s ease;
}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:0.4; cursor:not-allowed;}
.btn-primary{background:var(--brand-green); color:#fff; box-shadow:0 2px 8px -2px rgba(20,164,94,0.45);}
.btn-primary:hover:not(:disabled){background:#0F8A4F;}
.btn-ghost{background:#F3F5F1; color:var(--ink-soft); border:1px solid var(--line);}
.btn-ghost:hover:not(:disabled){background:#E7EAE3; color:var(--ink);}
.btn-outline{background:#fff; color:var(--ink); border:1px solid var(--line);}
.btn-outline:hover:not(:disabled){border-color:var(--brand-green); color:var(--brand-green);}
.btn-sm{padding:6px 11px; font-size:12px;}

/* ---------- Layout ---------- */
main{max-width:1360px; margin:0 auto; padding:26px 28px 80px;}
.section-title{display:flex; align-items:baseline; gap:10px; margin:0 0 4px;}
.section-title .num{
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px; color:var(--accent);
  background:var(--accent-soft); padding:3px 8px; border-radius:6px;
}
.section-title h2{font-size:19px; margin:0; font-weight:700;}
.section-sub{color:var(--muted); font-size:13px; margin:0 0 18px;}

/* ---------- Upload cards ---------- */
.upload-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:20px;}
@media (max-width:820px){.upload-grid{grid-template-columns:1fr;}}
.upload-card{
  background:var(--panel); border:1.5px dashed var(--line); border-radius:var(--radius);
  padding:18px 18px 16px; position:relative; transition:border-color .15s, background .15s;
  cursor:pointer;
}
.upload-card:hover{border-color:var(--accent);}
.upload-card.filled{border-style:solid; border-color:var(--accent);}
.upload-card input{display:none;}
.uc-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
.uc-index{
  font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); font-weight:600;
  background:var(--paper); border-radius:5px; padding:2px 7px;
}
.uc-title{font-weight:700; font-size:14.5px; margin:10px 0 3px;}
.uc-desc{color:var(--muted); font-size:12.5px; margin:0 0 10px;}
.uc-status{
  display:flex; align-items:center; gap:7px; font-size:12.5px; font-family:'IBM Plex Mono',monospace;
  border-top:1px solid var(--line-soft); padding-top:10px; margin-top:2px; color:var(--muted);
}
.uc-status .dot{width:7px;height:7px;border-radius:50%; background:var(--line); flex:none;}
.upload-card.filled .uc-status .dot{background:var(--accent);}
.upload-card.filled .uc-status{color:var(--accent); font-weight:600;}
.uc-status .fname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;}

.run-row{display:flex; align-items:center; gap:12px; margin-top:6px; flex-wrap:wrap;}
.run-hint{color:var(--muted); font-size:12.5px;}

/* ---------- Tabs ---------- */
.tabbar{
  display:flex; gap:4px; border-bottom:1.5px solid var(--line); margin:30px 0 22px; overflow-x:auto;
}
.tab-btn{
  background:none; border:none; padding:10px 16px; font-size:13.5px; font-weight:600; color:var(--muted);
  border-bottom:2.5px solid transparent; white-space:nowrap; margin-bottom:-1.5px; transition:color .15s ease, border-color .15s ease;
}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--brand-green); border-bottom-color:var(--brand-green);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ---------- Cards / KPI ---------- */
.kpi-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:22px;}
@media (max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}

.two-col-row{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start;}
@media (max-width:900px){.two-col-row{grid-template-columns:1fr;}}

/* weekly schedule table */
.wk-pill{display:inline-block; font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:99px; white-space:nowrap;}
.wk-work{background:var(--teal-soft); color:#0A8C7F;}
.wk-off{background:#E7E9E4; color:#5B6459;}
.wk-sub{background:#DCEEF5; color:#1D7A9C;}
.wk-comp{background:#EAE3FA; color:#6B4FC7;}
.wk-edu{background:#EAEAE6; color:#7C8378;}
.wk-blank{background:#F2F3F0; color:#B4B9AE; font-weight:500;}
/* today column: border ring only — no background tint, so pill colors/text never wash out */
td.wk-today-col{box-shadow: inset 2px 0 0 var(--accent), inset -2px 0 0 var(--accent);}
tbody tr:first-child td.wk-today-col{box-shadow: inset 2px 0 0 var(--accent), inset -2px 0 0 var(--accent), inset 0 2px 0 var(--accent);}
tbody tr:last-child td.wk-today-col{box-shadow: inset 2px 0 0 var(--accent), inset -2px 0 0 var(--accent), inset 0 -2px 0 var(--accent);}
th.wk-today-col{background:var(--accent-soft); color:var(--accent); box-shadow: inset 2px 0 0 var(--accent), inset -2px 0 0 var(--accent), inset 0 2px 0 var(--accent);}
.kpi{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 17px 15px; box-shadow:0 1px 3px rgba(16,25,43,0.04); transition:box-shadow .15s ease;}
.kpi:hover{box-shadow:0 4px 14px -4px rgba(16,25,43,0.12);}
.kpi .kpi-label{font-size:11.5px; color:var(--muted); font-weight:600; letter-spacing:0.2px; text-transform:uppercase;}
.kpi .kpi-value{font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:700; margin:6px 0 3px; color:var(--ink);}
.kpi .kpi-note{font-size:11.5px; color:var(--muted);}
.kpi.warn .kpi-value{color:var(--danger);}
.kpi.good .kpi-value{color:var(--accent);}

.panel-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-bottom:18px; box-shadow:0 1px 3px rgba(16,25,43,0.04);}
.panel-card h3{margin:0 0 14px; font-size:14.5px; font-weight:700; padding-left:10px; border-left:3px solid var(--brand-green); letter-spacing:-0.1px;}

/* bar rows */
.bar-row{display:grid; grid-template-columns:150px 1fr 60px; align-items:center; gap:10px; padding:6px 0; font-size:12.5px;}
.bar-row .lbl{color:var(--ink-soft); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bar-track{background:var(--paper); border-radius:6px; height:9px; overflow:hidden;}
.bar-fill{height:100%; background:var(--accent); border-radius:6px;}
.bar-fill.warn{background:var(--danger);}
.bar-row .val{text-align:right; font-family:'IBM Plex Mono',monospace; color:var(--muted);}

/* ---------- Tables ---------- */
.table-wrap{overflow:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel);}
table{border-collapse:collapse; width:100%; font-size:12.8px;}
thead th{
  position:sticky; top:0; background:#F5F6F2; text-align:left; padding:9px 12px; font-weight:700;
  border-bottom:1.5px solid var(--line); white-space:nowrap; font-size:11.5px; color:var(--ink-soft);
  letter-spacing:0.2px; z-index:2;
}
tbody td{padding:8px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top; white-space:nowrap;}
tbody tr:hover{background:#F7F8F5;}
td.wrap, th.wrap{white-space:normal;}
.tag{
  display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; white-space:nowrap;
}
.tag-ok{background:var(--teal-soft); color:#0A8C7F;}
.tag-edu{background:#DCEFFB; color:#0B67A8;}
.tag-off{background:#EAEAE6; color:#5B6459;}
.tag-leave{background:var(--accent-soft); color:var(--accent);}
.tag-pending{background:var(--amber-soft); color:#8A6415;}
.tag-future{background:#EFEFEC; color:#9AA298; border:1px dashed #C9CFC5;}
.tag-danger{background:var(--danger-soft); color:#C13F34;}
.tag-orange{background:var(--accent2-soft); color:#B96A28;}
.tag-purple{background:var(--purple-soft); color:#6B5FD6;}
.tag-sub{background:#DCEEF5; color:#1D7A9C;}
.tag-comp{background:#EAE3FA; color:#6B4FC7;}
.tag-status-대기{background:var(--amber-soft); color:#8A6415;}
.tag-status-승인{background:var(--teal-soft); color:#0A8C7F;}

/* filter row */
.filter-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
.filter-row select, .filter-row input[type="text"]{
  border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:12.8px; font-family:inherit;
  background:#fff; color:var(--ink);
}
.filter-row input[type="text"]{min-width:200px;}
.filter-row label{font-size:11.5px; color:var(--muted); font-weight:600; margin-right:-4px;}
.count-pill{
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; background:var(--paper); padding:5px 10px; border-radius:7px; color:var(--muted);
}

/* org tree */
.org-region{margin-bottom:16px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:#fff;}
.org-region-head{
  background:#F5F6F2; padding:11px 16px; font-weight:700; font-size:13.5px; display:flex; justify-content:space-between; align-items:center;
  cursor:pointer; user-select:none;
}
.org-region-head .stat{font-size:11.5px; color:var(--muted); font-weight:500; font-family:'IBM Plex Mono',monospace;}
.org-manager{padding:0 16px;}
.org-manager-row{
  padding:10px 0; border-top:1px solid var(--line-soft); display:flex; align-items:center; gap:14px; flex-wrap:wrap; cursor:pointer;
}
.org-manager-row .name{font-weight:700; min-width:90px;}
.org-manager-row .meta{color:var(--muted); font-size:12px;}
.org-manager-row .spacer{flex:1;}
.chev{transition:transform .15s; color:var(--muted); font-size:11px;}
.org-manager-row.open .chev{transform:rotate(90deg);}
.org-ce-list{display:none; padding:2px 0 12px 6px;}
.org-ce-list.open{display:block;}
.org-ce-chip{
  display:inline-flex; align-items:center; gap:6px; background:var(--paper); border:1px solid var(--line);
  border-radius:99px; padding:5px 11px 5px 8px; margin:3px 5px 3px 0; font-size:12px; cursor:pointer;
}
.org-ce-chip .dot{width:7px;height:7px;border-radius:50%;}
.org-ce-chip:hover{border-color:var(--accent);}

/* calendar */
.employee-picker{display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
.cal-legend{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.cal-legend .item{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--muted);}
.cal-legend .sw{width:11px;height:11px;border-radius:3px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-cell{
  border-radius:8px; padding:8px 8px 6px; min-height:64px; font-size:11px; border:1px solid var(--line-soft);
  display:flex; flex-direction:column; gap:4px;
}
.cal-cell .d{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px;}
.cal-cell .s{font-size:10px; font-weight:700; line-height:1.3;}
.cal-cell .t{font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--muted);}
.emp-summary-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:16px;}
.emp-summary-card .row{display:flex; gap:26px; flex-wrap:wrap;}
.emp-summary-card .item .k{font-size:11px; color:var(--muted); font-weight:600;}
.emp-summary-card .item .v{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;}

.quota-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px;}
.quota-box{border:1px solid var(--line); border-radius:9px; padding:13px 15px; background:#fbfcfb;}
.quota-label{font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
.quota-used{font-size:13px; color:var(--ink); margin-bottom:4px;}
.quota-note{font-size:11.5px; color:var(--muted);}
.quota-remain{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;}
.quota-remain.ok{color:var(--accent);}
.quota-remain.over{color:var(--danger);}
.quota-input{width:64px; padding:5px 7px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; font-family:'IBM Plex Mono',monospace;}

.empty-state{
  text-align:center; padding:60px 20px; color:var(--muted);
}
.empty-state .big{font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; color:var(--ink); margin-bottom:6px;}

.notice{
  border-radius:9px; padding:12px 14px; font-size:12.5px; margin-bottom:16px; display:flex; gap:10px; align-items:flex-start;
}
.notice-warn{background:var(--amber-soft); color:#7A5A10; border:1px solid #E9D293;}
.notice-info{background:#E3ECF6; color:#2A4C77; border:1px solid #C4D6EC;}
.notice b{font-weight:700;}

footer.app-footer{text-align:center; padding:30px 20px 50px; color:var(--muted); font-size:11.5px;}

#dropOverlay{
  position:fixed; inset:0; background:rgba(18,32,43,0.55); z-index:200; display:none;
  align-items:center; justify-content:center; color:#fff; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700;
}
.gate-card{
  max-width:520px; margin:60px auto; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:36px 32px; text-align:center; box-shadow:var(--shadow);
}
.gate-card .icon{font-size:30px; margin-bottom:10px;}
.gate-card h2{font-size:18px; margin:0 0 8px;}
.gate-card p{color:var(--muted); font-size:13px; margin:0 0 20px; line-height:1.6;}
.gate-spinner{
  width:22px; height:22px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%;
  margin:0 auto 14px; animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.modal-backdrop{
  position:fixed; inset:0; background:rgba(16,25,43,0.55); z-index:300; display:flex; align-items:center; justify-content:center;
}
.modal-card{
  background:#fff; border-radius:12px; padding:26px 26px 22px; width:320px; box-shadow:0 20px 50px -10px rgba(16,25,43,0.4);
}
.modal-card h3{margin:0 0 4px; font-size:15px;}
.modal-card p{margin:0 0 14px; font-size:12.5px; color:var(--muted);}
.modal-card input{
  width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:'IBM Plex Mono',monospace;
  margin-bottom:12px;
}
.modal-card .actions{display:flex; gap:8px; justify-content:flex-end;}
.link-btn{
  background:none; border:none; color:var(--muted); font-size:11.5px; text-decoration:underline; cursor:pointer; padding:0;
}
.link-btn:hover{color:var(--accent);}
.admin-pill{
  display:inline-flex; align-items:center; gap:6px; background:var(--teal-soft); color:#0A8C7F; font-size:11.5px; font-weight:700;
  padding:4px 10px; border-radius:99px;
}
.filemeta-list{border:1px solid var(--line); border-radius:9px; overflow:hidden;}
.filemeta-row{
  display:grid; grid-template-columns:120px 1fr auto; gap:10px; align-items:center;
  padding:11px 13px; border-bottom:1px solid var(--line-soft); font-size:12px;
}
.filemeta-row:last-child{border-bottom:none;}
.filemeta-row:nth-child(even){background:#FAFBF9;}
.filemeta-label{font-weight:700; color:var(--ink-soft);}
.filemeta-name{color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.filemeta-empty{color:var(--muted); font-style:italic;}
.filemeta-time{font-family:'IBM Plex Mono',monospace; color:var(--muted); font-size:11px; white-space:nowrap;}

/* vertical bar chart (지역별) */
.vbar-chart{display:flex; align-items:flex-end; gap:14px; height:180px; padding:6px 4px 0; overflow-x:auto;}
.vbar-col{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; min-width:52px; height:100%; flex:1;}
.vbar-count{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; margin-bottom:4px;}
.vbar{width:34px; border-radius:6px 6px 3px 3px; background:var(--accent); position:relative; min-height:4px; transition:height .25s ease;}
.vbar .anom-mark{
  position:absolute; top:-9px; left:50%; transform:translateX(-50%); font-size:10px; font-weight:700; color:var(--danger);
  white-space:nowrap;
}
.vbar-label{margin-top:8px; font-size:11px; color:var(--muted); font-weight:600; text-align:center; max-width:62px; overflow:hidden; text-overflow:ellipsis;}

/* manager number-summary grid */
.mgr-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; max-height:300px; overflow-y:auto; padding-right:4px;}
.chart-scroll{max-height:300px; overflow-y:auto; padding-right:4px;}
.mgr-card{
  border:1px solid var(--line); border-radius:9px; padding:12px 13px; background:#fbfcfb;
}
.mgr-card .name{font-weight:700; font-size:12.8px; margin-bottom:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mgr-card .nums{display:flex; align-items:baseline; gap:8px;}
.mgr-card .nums .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; color:var(--ink);}
.mgr-card .nums .n-label{font-size:10.5px; color:var(--muted);}
.mgr-card .anom{margin-top:6px; font-size:11px; font-weight:700;}
.mgr-card .anom.zero{color:var(--muted); font-weight:500;}
.mgr-card .anom.some{color:var(--danger);}

/* icon-based distribution cards */
.dist-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:10px;}
.dist-card{
  border-radius:10px; padding:14px 10px 12px; text-align:center; border:1px solid transparent;
}
.dist-card .ic{
  width:30px; height:30px; border-radius:50%; margin:0 auto; color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700; line-height:1; font-family:'Space Grotesk',sans-serif;
}
.dist-card .n{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; margin:8px 0 1px;}
.dist-card .pct{font-size:11px; font-weight:700; opacity:0.85;}
.dist-card .lbl{font-size:10.5px; margin-top:4px; color:var(--ink-soft); line-height:1.3;}
/* ---------- Mobile (phone) layout ---------- */
@media (max-width: 720px){
  html{ -webkit-text-size-adjust:100%; }
  body{ font-size:13px; }
  header.topbar{ padding:12px 14px; flex-direction:column; align-items:flex-start; gap:8px; }
  .brand-logo{ height:32px; }
  .brand-text h1{ font-size:14.5px; }
  .brand-text p{ font-size:10.5px; }
  .brand-slogan-badge{ font-size:9px; padding:2px 7px; }
  .topbar-actions{ width:100%; }
  .topbar-actions .badge{ font-size:10.5px; padding:5px 8px; }
  .topbar-actions .btn{ font-size:11.5px; padding:7px 11px; }
  main{ padding:16px 12px 60px; }
  .section-title h2{ font-size:16px; }
  .section-sub{ font-size:12px; }
  .upload-grid{ grid-template-columns:1fr; }
  .kpi-grid{ grid-template-columns:repeat(2,1fr); gap:8px; }
  .kpi{ padding:12px 12px 10px; }
  .kpi .kpi-value{ font-size:21px; }
  .mgr-grid{ grid-template-columns:repeat(2,1fr); }
  .dist-grid{ grid-template-columns:repeat(3,1fr); gap:8px; }
  .dist-card{ padding:10px 6px 9px; }
  .dist-card .n{ font-size:16px; }
  .tabbar{ gap:0; }
  .tab-btn{ padding:9px 11px; font-size:12px; }
  .employee-picker, .filter-row{ flex-direction:column; align-items:stretch; gap:8px; }
  .employee-picker select, .employee-picker input, .filter-row select, .filter-row input[type="text"]{ width:100%; min-width:0; }
  .filter-row .count-pill{ align-self:flex-start; }
  table{ font-size:11px; }
  thead th, tbody td{ padding:7px 8px; }
  .cal-grid{ gap:4px; }
  .cal-cell{ min-height:52px; padding:6px 6px 4px; font-size:9.5px; border-radius:6px; }
  .cal-cell .d{ font-size:11px; }
  .emp-summary-card .row{ gap:14px; }
  .quota-grid{ grid-template-columns:1fr; }
  .org-manager-row{ flex-wrap:wrap; gap:6px 12px; }
  .modal-card{ width:88vw; }
  .wk-pill{ font-size:10px; padding:4px 7px; }
}
</style>
</head>

<script>
'use strict';

/* =========================================================================
   CONSTANTS
   ========================================================================= */
const WORK_CODES  = ['근무','근무A'];
const EDU_CODES   = ['교육'];
const OFF_CODES   = ['휴무','대체휴일(1일)','대체휴일(0.5일)','보상휴가(1일)','보상휴가(0.5일)'];
const LEAVE_CODES = ['연차','오전반차','오후반차'];
const LEAVE_STATUS_KEEP = ['대기','승인']; // per spec: only these are reflected

const STATUS_META = {
  work_ok:          {label:'정상출근',                 cls:'tag-ok',      color:'#0A8C7F', severity:0, icon:'✓'},
  work_ok_edu:       {label:'정상출근(교육)',            cls:'tag-edu',     color:'#0B67A8', severity:0, icon:'✓'},
  off_ok:            {label:'정상(휴무)',                cls:'tag-off',     color:'#8A9188', severity:0, icon:'–'},
  leave_ok:          {label:'정상(휴무)',            cls:'tag-leave',   color:'#0B3B8C', severity:0, icon:'✓'},
  leave_pending:     {label:'연차 신청(대기중)',          cls:'tag-pending', color:'#8A6415', severity:1, icon:'◐'},
  future:            {label:'예정',                      cls:'tag-future',  color:'#9AA298', severity:-1, icon:'○'},
  absent_unauth:     {label:'결근(미출근·연차 미신청)',    cls:'tag-danger',  color:'#C13F34', severity:3, icon:'✕'},
  leave_unmatched:   {label:'연차신청내역 없음(스케줄만 반영)', cls:'tag-orange', color:'#B96A28', severity:2, icon:'!'},
  off_but_worked:    {label:'휴무일 출근',                cls:'tag-purple',  color:'#6B5FD6', severity:1, icon:'↻'},
  no_schedule:       {label:'스케줄 미입력',              cls:'tag-danger',  color:'#C13F34', severity:2, icon:'?'},
  leave_not_reflected:{label:'연차사용(스케줄 미반영)',    cls:'tag-orange',  color:'#B96A28', severity:1, icon:'↻'},
};

const WEEKDAYS_KR = ['일','월','화','수','목','금','토'];

// STATUS_META collapses 휴무/대체휴일/보상휴가 (and 연차) into one "정상(휴무)" bucket for
// severity/anomaly purposes, but the calendar should still show which specific kind of
// day-off it was, with its own color, whenever the day was actually judged off_ok.
function offDayDisplay(planCode){
  const c = (planCode||'').trim();
  if (c.startsWith('대체휴일')) return {label:c, color:'#1D7A9C', cls:'tag-sub'};
  if (c.startsWith('보상휴가')) return {label:c, color:'#6B4FC7', cls:'tag-comp'};
  return {label: STATUS_META.off_ok.label, color: STATUS_META.off_ok.color, cls: STATUS_META.off_ok.cls};
}
// display meta for any day cell — off_ok gets the granular breakdown above, everything
// else just uses its normal STATUS_META entry.
function dayDisplayMeta(judgement, planCode){
  if (judgement === 'off_ok') return offDayDisplay(planCode);
  return STATUS_META[judgement];
}

/* =========================================================================
   STATE
   ========================================================================= */
const FILES = { plan:null, attend:null, leave:null, match:null };
let ANALYSIS = null; // filled after "run"
let ACTIVE_EMP = null; // sabun currently shown in employee tab
let EMP_MANAGER_FILTER = '전체'; // manager filter for the 상담사별 상세 tab
let ORG_ROUTE_FILTER = '전체';
let ANOMALY_FILTERS = { type:'전체', date:'전체', region:'전체', manager:'전체', q:'' };
let LEAVE_FILTERS = { status:'전체', manager:'전체', date:'전체', q:'' };
let QUOTA_SEARCH = '';
let WEEK_OFFSET = 0; // 0 = the week containing the analysis cutoff date
let WEEK_REGION_FILTER = '전체';
let WEEK_MANAGER_FILTER = '전체';
let WEEK_SEARCH = '';

// cached 매장/매니저 매칭 data so the admin doesn't have to re-upload it every run —
// only replaced when a new match file is actually uploaded.
let CACHED_MATCH_DATA = null;

// tracks, for each of the 4 source files, the filename + when it was last (re)applied —
// shown to admin and viewers alike via the "업데이트 정보" notice.
let FILE_META = { plan:null, attend:null, leave:null, match:null };
const FILE_META_LABELS = { plan:'매장근무계획관리', attend:'근태관리(출퇴근)', leave:'연차/반차 신청현황', match:'매장·매니저 매칭' };

// --- admin / shared-view mode ---
// This is a simple client-side access code, not real authentication — anyone who
// opens this file's source can read it. Change it before sharing the link.
const ADMIN_PASSCODE = 'zeniel2026';
const SHARED_KEY = 'zeniel_attendance_latest';
let IS_ADMIN = false;
let SAVED_META = null; // {savedAt} pulled from shared storage
let STORAGE_AVAILABLE = (typeof window !== 'undefined' && !!window.storage);

// per-sabun monthly allotments the admin enters: { [sabun]: { paid: number, sub: number } }
let QUOTAS = {};

/* =========================================================================
   GENERIC HELPERS
   ========================================================================= */
function pad2(n){ return String(n).padStart(2,'0'); }
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function normName(s){ return String(s||'').replace(/\s+/g,'').trim(); }

// Korean (and other IME) input composes multiple keystrokes into one character.
// Re-rendering the DOM on every 'input' event destroys the input mid-composition
// and corrupts what the person is typing. This binds a search box so the callback
// only fires once a character is fully composed (or immediately for non-IME input).
function bindSearchInput(input, callback, delay){
  let composing = false;
  let timer = null;
  const wait = delay == null ? 180 : delay;
  const trigger = val => { clearTimeout(timer); timer = setTimeout(() => callback(val), wait); };
  input.addEventListener('compositionstart', () => { composing = true; });
  input.addEventListener('compositionend', e => { composing = false; trigger(e.target.value); });
  input.addEventListener('input', e => {
    if (composing || e.isComposing) return;
    trigger(e.target.value);
  });
}
function cellToStr(v){
  if (v == null) return '';
  if (v instanceof Date){
    return `${v.getFullYear()}-${pad2(v.getMonth()+1)}-${pad2(v.getDate())}`;
  }
  return String(v).trim();
}
function sheetToRows(ws){
  return XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
}
function findHeaderRow(rows, requiredHeaders, maxScan){
  maxScan = maxScan || 10;
  for (let i=0; i<Math.min(rows.length, maxScan); i++){
    const row = rows[i].map(c => cellToStr(c));
    if (requiredHeaders.every(h => row.includes(h))) return i;
  }
  return -1;
}
function buildColMap(headerRow){
  const map = {};
  headerRow.forEach((h,i) => { const key = cellToStr(h); if (key && !(key in map)) map[key] = i; });
  return map;
}
function dateStrFromParts(y,m,d){ return `${y}${pad2(m)}${pad2(d)}`; }
function isoFromParts(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }
function isoToDateObj(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d);
}
function isoAddDays(iso, n){
  const d = isoToDateObj(iso);
  d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function fmtNum(n){ return Number(n||0).toLocaleString('ko-KR'); }
function fmtPct(n){ return (Math.round(n*10)/10).toFixed(1) + '%'; }

/* =========================================================================
   PARSERS  — each returns null if the sheet doesn't look like the expected type
   ========================================================================= */

// ---- 01 매장근무계획관리 ----
function tryParsePlan(wb){
  for (const sn of wb.SheetNames){
    const rows = sheetToRows(wb.Sheets[sn]);
    const hIdx = findHeaderRow(rows, ['매장명','사번','이름','재직상태']);
    if (hIdx === -1) continue;
    const header = rows[hIdx].map(cellToStr);
    const col = buildColMap(header);
    // day columns like '01일'..'31일'
    const dayCols = [];
    header.forEach((h,i) => {
      const m = /^(\d{1,2})일$/.exec(h);
      if (m) dayCols.push({day:parseInt(m[1],10), idx:i});
    });
    dayCols.sort((a,b)=>a.day-b.day);
    if (dayCols.length === 0) continue;

    const employees = [];
    for (let r=hIdx+1; r<rows.length; r++){
      const row = rows[r];
      const sabun = cellToStr(row[col['사번']]);
      const store = cellToStr(row[col['매장명']]);
      if (!sabun && !store) continue;
      if (!sabun) continue;
      const dailyPlan = {};
      dayCols.forEach(dc => { dailyPlan[dc.day] = cellToStr(row[dc.idx]); });
      employees.push({
        store, sabun,
        name: cellToStr(row[col['이름']]),
        status: cellToStr(row[col['재직상태']]),
        grade: col['직위']!=null ? cellToStr(row[col['직위']]) : '',
        title: col['직책']!=null ? cellToStr(row[col['직책']]) : '',
        job: col['직무']!=null ? cellToStr(row[col['직무']]) : '',
        dailyPlan,
        summary: {
          work: col['근무']!=null ? cellToStr(row[col['근무']]) : '',
          leave: col['연차']!=null ? cellToStr(row[col['연차']]) : '',
        }
      });
    }
    if (employees.length === 0) continue;
    return { employees, maxDay: Math.max(...dayCols.map(d=>d.day)), sheetName: sn };
  }
  return null;
}

// ---- 02 근태관리 (실제 출퇴근) ----
function extractStoreCode(place){
  const m = /^(\d+)_/.exec((place||'').trim());
  return m ? m[1] : null;
}

function tryParseAttend(wb){
  for (const sn of wb.SheetNames){
    const rows = sheetToRows(wb.Sheets[sn]);
    const hIdx = findHeaderRow(rows, ['근무일자','사번']);
    if (hIdx === -1) continue;
    const header = rows[hIdx].map(cellToStr);
    const col = buildColMap(header);
    const records = [];
    const byKey = new Map(); // sabun|YYYYMMDD -> record
    const codeTally = new Map(); // sabun -> Map<code,count>
    let maxDateStr = '';
    for (let r=hIdx+1; r<rows.length; r++){
      const row = rows[r];
      const sabun = cellToStr(row[col['사번']]);
      let dateStr = cellToStr(row[col['근무일자']]);
      dateStr = dateStr.replace(/[^0-9]/g,'');
      if (!sabun || dateStr.length < 8) continue;
      dateStr = dateStr.slice(0,8);
      const inPlace = col['출근지점']!=null ? cellToStr(row[col['출근지점']]) : '';
      const rec = {
        name: col['이름']!=null ? cellToStr(row[col['이름']]) : '',
        sabun, dateStr,
        inTime: col['(실제)출근시간']!=null ? cellToStr(row[col['(실제)출근시간']]) : '',
        outTime: col['(실제)퇴근시간']!=null ? cellToStr(row[col['(실제)퇴근시간']]) : '',
        inTimeChg: col['(변경)출근시간']!=null ? cellToStr(row[col['(변경)출근시간']]) : '',
        outTimeChg: col['(변경)퇴근시간']!=null ? cellToStr(row[col['(변경)퇴근시간']]) : '',
        inPlace, outPlace: col['퇴근지점']!=null ? cellToStr(row[col['퇴근지점']]) : '',
        editReq: col['수정요청']!=null ? cellToStr(row[col['수정요청']]) : '',
      };
      records.push(rec);
      byKey.set(sabun+'|'+dateStr, rec);
      if (dateStr > maxDateStr) maxDateStr = dateStr;
      const code = extractStoreCode(inPlace);
      if (code){
        if (!codeTally.has(sabun)) codeTally.set(sabun, new Map());
        const m = codeTally.get(sabun);
        m.set(code, (m.get(code)||0) + 1);
      }
    }
    if (records.length === 0) continue;
    // pick the most frequently used store code per employee (handles occasional
    // clock-ins from a training center or other location without skewing the match)
    const codeBySabun = new Map();
    codeTally.forEach((counts, sabun) => {
      let best = null, bestCount = 0;
      counts.forEach((c, code) => { if (c > bestCount){ best = code; bestCount = c; } });
      if (best) codeBySabun.set(sabun, best);
    });
    return { records, byKey, maxDateStr, sheetName: sn, codeBySabun };
  }
  return null;
}

// ---- 03 연차신청현황 ----
function tryParseLeave(wb){
  for (const sn of wb.SheetNames){
    const rows = sheetToRows(wb.Sheets[sn]);
    const hIdx = findHeaderRow(rows, ['상태','신청일','휴가기간(시작)','휴가기간(종료)']);
    if (hIdx === -1) continue;
    const header = rows[hIdx].map(cellToStr);
    const col = buildColMap(header);
    const all = [];
    for (let r=hIdx+1; r<rows.length; r++){
      const row = rows[r];
      const sabun = cellToStr(row[col['사번']]);
      const status = cellToStr(row[col['상태']]);
      const start = cellToStr(row[col['휴가기간(시작)']]).slice(0,10);
      const end = cellToStr(row[col['휴가기간(종료)']]).slice(0,10);
      if (!sabun || !start) continue;
      all.push({
        name: col['이름']!=null ? cellToStr(row[col['이름']]) : '',
        sabun, status,
        applyDate: col['신청일']!=null ? cellToStr(row[col['신청일']]).slice(0,10) : '',
        start, end: end || start,
        amount: col['사용갯수']!=null ? cellToStr(row[col['사용갯수']]) : '',
        kind: col['휴가구분']!=null ? cellToStr(row[col['휴가구분']]) : '',
        dest: col['행선지']!=null ? cellToStr(row[col['행선지']]) : '',
        note: col['비고']!=null ? cellToStr(row[col['비고']]) : '',
        erp: col['ERP전송여부']!=null ? cellToStr(row[col['ERP전송여부']]) : '',
      });
    }
    if (all.length === 0) continue;
    const kept = all.filter(x => LEAVE_STATUS_KEEP.includes(x.status));
    const dateMap = new Map(); // sabun|iso -> [entries]
    kept.forEach(entry => {
      let cur = entry.start;
      let guard = 0;
      while (cur <= entry.end && guard < 60){
        const key = entry.sabun+'|'+cur;
        if (!dateMap.has(key)) dateMap.set(key, []);
        dateMap.get(key).push(entry);
        cur = isoAddDays(cur, 1);
        guard++;
      }
    });
    return { all, kept, dropped: all.filter(x=>!LEAVE_STATUS_KEEP.includes(x.status)), dateMap, sheetName: sn };
  }
  return null;
}

// ---- 04 매장/매니저 매칭 ----
function tryParseMatch(wb){
  for (const sn of wb.SheetNames){
    const rows = sheetToRows(wb.Sheets[sn]);
    const hIdx = findHeaderRow(rows, ['매장','지역장','매니저']);
    if (hIdx === -1) continue;
    const header = rows[hIdx].map(cellToStr);
    const col = buildColMap(header);
    const storeMap = new Map(); // normName -> info
    const codeMap = new Map(); // 매장코드(string) -> info — authoritative, from 근태관리 출근지점 prefix
    const storeList = [];
    for (let r=hIdx+1; r<rows.length; r++){
      const row = rows[r];
      const store = cellToStr(row[col['매장']]);
      if (!store) continue;
      const storeCode = col['매장코드']!=null ? cellToStr(row[col['매장코드']]) : '';
      const info = {
        store, storeCode,
        region: col['권역']!=null ? cellToStr(row[col['권역']]) : '',
        area: col['지역']!=null ? cellToStr(row[col['지역']]) : '',
        route: col['경로']!=null ? cellToStr(row[col['경로']]) : '',
        regionHead: col['지역장']!=null ? cellToStr(row[col['지역장']]) : '',
        manager: col['매니저']!=null ? cellToStr(row[col['매니저']]) : '',
        closedDate: col['폐점 날짜']!=null ? cellToStr(row[col['폐점 날짜']]) : '',
        note: col['비고']!=null ? cellToStr(row[col['비고']]) : '',
      };
      storeMap.set(normName(store), info);
      if (storeCode) codeMap.set(storeCode, info);
      storeList.push(store);
    }
    if (storeList.length === 0) continue;
    return { storeMap, codeMap, storeList, sheetName: sn };
  }
  return null;
}

  renderOrg();
  renderEmployeeTab();
  renderAnomaly();

/* =========================================================================
   TAB: 요약
   ========================================================================= */
function renderSummary(){
  const a = ANALYSIS;
  const total = a.employees.length;
  const totalCells = a.dayMatrix.filter(d => {
    const j = d.judgement;
    return j !== 'future';
  }).length;
  const okCells = a.dayMatrix.filter(d => STATUS_META[d.judgement].severity === 0).length;
  const attendRate = totalCells ? (okCells/totalCells*100) : 0;
  const anomalyCount = a.anomalies.length;
  const severe = a.anomalies.filter(x => STATUS_META[x.judgement].severity >= 3).length;
  const pendingLeave = a.leaveEnriched.filter(x=>x.status==='대기').length;
  const approvedLeave = a.leaveEnriched.filter(x=>x.status==='승인').length;
  const unmatchedNote = a.unmatchedStores.length
    ? `<div class="notice notice-warn"><span>⚠</span><div><b>매장 매칭 실패 (${a.unmatchedStores.length}개)</b> — 근무계획표의 매장명과 매칭현황표의 매장명이 일치하지 않습니다: ${a.unmatchedStores.map(escapeHtml).join(', ')}. 지역장/매니저 정보가 "미매칭"으로 표기됩니다.</div></div>`
    : '';
  const ghostNote = a.ghostSabuns.length
    ? `<div class="notice notice-info"><span>ℹ</span><div><b>근무계획표에 없는 인원 (${a.ghostSabuns.length}명)</b> — 근태입력/연차신청 파일에는 존재하지만 매장근무계획표 명단에는 없어 일자별 분석에서 제외되었습니다: ${a.ghostSabuns.map(s=>escapeHtml(s.split('|')[1]||s.split('|')[0])).join(', ')}</div></div>`
    : '';

  // group by 지역 (area) for bar chart
  const byArea = new Map();
  a.employees.forEach(e => {
    const key = e.area || '미매칭';
    if (!byArea.has(key)) byArea.set(key, {count:0, anomalies:0});
    byArea.get(key).count++;
  });
  a.anomalies.forEach(x => {
    const key = x.area || '미매칭';
    if (byArea.has(key)) byArea.get(key).anomalies++;
  });
  const maxCount = Math.max(1, ...Array.from(byArea.values()).map(v=>v.count));
  const storeCountByArea = a.storeCountByArea || {};
  const areaChartHtml = Array.from(byArea.entries())
    .sort((x,y)=>y[1].count-x[1].count)
    .map(([area,v]) => {
      const storeCnt = storeCountByArea[area];
      const storeTag = storeCnt!=null ? ` <span style="color:var(--muted);font-weight:500;">(매장 ${storeCnt}개)</span>` : '';
      return `
      <div class="bar-row">
        <div class="lbl">${escapeHtml(area)}${storeTag}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${v.count/maxCount*100}%"></div></div>
        <div class="val">${v.count}명 · 이상${v.anomalies}</div>
      </div>`;
    }).join('');

  // sanity check: does the sum of per-region 전자랜드 store counts match the match
  // file's total 전자랜드 store count? (guards against area-field typos/blank rows)
  const storeCountSum = Object.values(storeCountByArea).reduce((s,v)=>s+v,0);
  const storeCountMismatch = a.totalElectrolandStores>0 && storeCountSum !== a.totalElectrolandStores;
  const storeCountNote = a.totalElectrolandStores>0
    ? `<div class="notice ${storeCountMismatch?'notice-warn':'notice-info'}"><span>${storeCountMismatch?'⚠':'ℹ'}</span><div>매장매칭 파일 기준 전자랜드 매장은 총 <b>${a.totalElectrolandStores}개</b>이며, 지역별 합계는 <b>${storeCountSum}개</b>입니다.${storeCountMismatch ? ' 지역(권역) 값이 비어있거나 잘못 입력된 매장이 있을 수 있습니다.' : ' (일치합니다)'}</div></div>`
    : '';

  // group by 매니저 — compact number-summary cards
  const byMgr = new Map();
  a.employees.forEach(e => {
    const key = e.manager || '미매칭';
    if (!byMgr.has(key)) byMgr.set(key, {count:0, anomalies:0});
    byMgr.get(key).count++;
  });
  a.anomalies.forEach(x => {
    const key = x.manager || '미매칭';
    if (byMgr.has(key)) byMgr.get(key).anomalies++;
  });
  const mgrGridHtml = Array.from(byMgr.entries())
    .sort((x,y)=>y[1].count-x[1].count)
    .map(([mgr,v]) => `
      <div class="mgr-card">
        <div class="name">${escapeHtml(mgr)}</div>
        <div class="nums"><span class="n">${v.count}</span><span class="n-label">명</span></div>
        <div class="anom ${v.anomalies?'some':'zero'}">${v.anomalies ? `이상 ${v.anomalies}건` : '이상 없음'}</div>
      </div>`).join('');

  // judgement distribution — icon + number cards
  const dist = {};
  a.dayMatrix.forEach(d => { dist[d.judgement] = (dist[d.judgement]||0)+1; });
  const distTotal = Math.max(1, totalCells); // exclude 'future' from the % base
  const distHtml = Object.entries(dist).sort((x,y)=>y[1]-x[1]).map(([k,v]) => {
    const meta = STATUS_META[k];
    const pct = k === 'future' ? null : (v/distTotal*100);
    return `
    <div class="dist-card" style="background:${meta.color}14; border-color:${meta.color}33;">
      <div class="ic" style="background:${meta.color}">${meta.icon}</div>
      <div class="n" style="color:${meta.color}">${fmtNum(v)}</div>
      ${pct!=null ? `<div class="pct" style="color:${meta.color}">${fmtPct(pct)}</div>` : ''}
      <div class="lbl">${escapeHtml(meta.label)}</div>
    </div>`;
  }).join('');

  document.getElementById('panel-summary').innerHTML = `
    ${unmatchedNote}
    ${ghostNote}
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">담당 상담사</div><div class="kpi-value">${total}</div><div class="kpi-note">${a.year}년 ${a.month}월 기준</div></div>
      <div class="kpi good"><div class="kpi-label">정상 처리율</div><div class="kpi-value">${fmtPct(attendRate)}</div><div class="kpi-note">기준일(${a.cutoffIso})까지 판정된 근무일 대비</div></div>
      <div class="kpi warn"><div class="kpi-label">이상 확인 필요</div><div class="kpi-value">${fmtNum(anomalyCount)}건</div><div class="kpi-note">그중 결근 등 심각 ${severe}건</div></div>
      <div class="kpi"><div class="kpi-label">연차 승인</div><div class="kpi-value">${fmtNum(approvedLeave)}건</div><div class="kpi-note">전체 신청 ${a.totalLeaveAll}건 중</div></div>
      <div class="kpi"><div class="kpi-label">연차 대기중</div><div class="kpi-value">${fmtNum(pendingLeave)}건</div><div class="kpi-note">승인 대기 상태</div></div>
    </div>

    ${storeCountNote}

    <div class="two-col-row">
      <div class="panel-card">
        <h3>지역별 담당 인원 &amp; 이상 건수</h3>

      </div>

      </div>

    <div class="panel-card">

}

/* =========================================================================
   주차별 상담사 주간근무계획표 (요약 탭 하단)
   ========================================================================= */
function mondayOf(dateObj){
  const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
  const day = d.getDay(); // 0=Sun..6=Sat
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  return d;
}

function getWeekDates(){
  const a = ANALYSIS;
  const cutoff = isoToDateObj(a.cutoffIso);
  const weekStart = mondayOf(cutoff);
  weekStart.setDate(weekStart.getDate() + WEEK_OFFSET*7);
  const dates = [];
  for (let i=0; i<7; i++){
    const d = new Date(weekStart);
    d.setDate(d.getDate()+i);
    const iso = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    const inMonth = d.getFullYear()===a.year && (d.getMonth()+1)===a.month;
    dates.push({ date:d, iso, day:d.getDate(), weekday:WEEKDAYS_KR[d.getDay()], inMonth, isToday: iso===a.cutoffIso });
  }
  return dates;
}

function scheduleCategory(code){
  const c = (code||'').trim();
  if (WORK_CODES.includes(c)) return 'work';
  if (OFF_CODES.includes(c) || LEAVE_CODES.includes(c)) return 'off';
  return 'edu'; // 교육 + 기타/미입력
}

// finer pill styling for the weekly table body — distinguishes 대체휴일/보상휴가 from
// plain 휴무/연차, matching the calendar's color coding.
function weekPillStyle(code){
  const c = (code||'').trim();
  if (WORK_CODES.includes(c)) return 'wk-pill wk-work';
  if (c.startsWith('대체휴일')) return 'wk-pill wk-sub';
  if (c.startsWith('보상휴가')) return 'wk-pill wk-comp';
  if (OFF_CODES.includes(c) || LEAVE_CODES.includes(c)) return 'wk-pill wk-off';
  return 'wk-pill wk-edu';
}

function getWeekFilteredEmployees(){
  const a = ANALYSIS;
  let emps = a.employees.slice().sort((x,y)=>x.name.localeCompare(y.name,'ko'));
  if (WEEK_REGION_FILTER!=='전체') emps = emps.filter(e => e.area===WEEK_REGION_FILTER);
  if (WEEK_MANAGER_FILTER!=='전체') emps = emps.filter(e => e.manager===WEEK_MANAGER_FILTER);
  if (WEEK_SEARCH){
    const q = normName(WEEK_SEARCH).toLowerCase();
    emps = emps.filter(e => normName(e.name).toLowerCase().includes(q) || e.sabun.toLowerCase().includes(q) || normName(e.store).toLowerCase().includes(q));
  }
  return emps;
}

function buildWeekTableRowsHtml(weekDates, emps){
  if (!emps.length) return `<tr><td colspan="${2+weekDates.length}" style="text-align:center;color:var(--muted);">조건에 맞는 상담사가 없습니다</td></tr>`;
  return emps.map(e => {
    const cells = weekDates.map(wd => {
      if (!wd.inMonth) return `<td class="${wd.isToday?'wk-today-col':''}"><span class="wk-pill wk-blank">-</span></td>`;
      const dayRec = e.days.find(d => d.day === wd.day);
      const code = dayRec ? (dayRec.planCode||'') : '';
      if (!code) return `<td class="${wd.isToday?'wk-today-col':''}"><span class="wk-pill wk-blank">-</span></td>`;
      return `<td class="${wd.isToday?'wk-today-col':''}"><span class="${weekPillStyle(code)}">${escapeHtml(code)}</span></td>`;
    }).join('');
    return `<tr><td>${escapeHtml(e.name)}</td><td>${escapeHtml(e.store)}</td>${cells}</tr>`;
  }).join('');
}

function updateWeekBody(){
  const weekDates = getWeekDates();
  const emps = getWeekFilteredEmployees();
  const tbody = document.getElementById('weekTbody');
  if (tbody) tbody.innerHTML = buildWeekTableRowsHtml(weekDates, emps);
  const pill = document.getElementById('weekCountPill');
  if (pill) pill.textContent = `${emps.length}명`;
}

function renderWeeklyScheduleHtml(){
  const a = ANALYSIS;
  const weekDates = getWeekDates();
  const emps = getWeekFilteredEmployees();

  // "오늘"(기준일) 스냅샷 KPI — 필터와 무관하게 전체 기준
  let workCnt=0, offCnt=0, eduCnt=0;
  a.employees.forEach(e => {
    const dayRec = e.days.find(d => d.day === a.cutoffDay);
    const cat = scheduleCategory(dayRec ? dayRec.planCode : '');
    if (cat==='work') workCnt++; else if (cat==='off') offCnt++; else eduCnt++;
  });

  const areas = Array.from(new Set(a.employees.map(e=>e.area).filter(Boolean))).sort((x,y)=>x.localeCompare(y,'ko'));
  const managers = Array.from(new Set(a.employees.map(e=>e.manager))).sort((x,y)=>x.localeCompare(y,'ko'));
  const weekLabel = `${weekDates[0].iso.slice(5).replace('-','/')} ~ ${weekDates[6].iso.slice(5).replace('-','/')}`;

  return `
    <div class="panel-card" id="weekSection">
      <h3>주차별 상담사 주간근무계획표</h3>
      <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr); margin-bottom:16px;">
        <div class="kpi good"><div class="kpi-label">오늘(${a.cutoffIso}) 근무</div><div class="kpi-value">${workCnt}명</div></div>
        <div class="kpi"><div class="kpi-label">오늘 휴무/연차</div><div class="kpi-value">${offCnt}명</div></div>
        <div class="kpi"><div class="kpi-label">오늘 교육/기타</div><div class="kpi-value">${eduCnt}명</div></div>
      </div>

      <div class="filter-row">
        <button class="btn btn-outline btn-sm" id="weekPrevBtn">◂ 이전 주</button>
        <span class="count-pill mono" id="weekRangeLabel">${weekLabel}</span>
        <button class="btn btn-outline btn-sm" id="weekNextBtn">다음 주 ▸</button>
        <label>지역</label>
        <select id="weekRegionFilter">
          <option value="전체">전체</option>
          ${areas.map(ar=>`<option value="${escapeHtml(ar)}" ${WEEK_REGION_FILTER===ar?'selected':''}>${escapeHtml(ar)}</option>`).join('')}
        </select>
        <label>담당자</label>
        <select id="weekMgrFilter">
          <option value="전체">전체</option>
          ${managers.map(m=>`<option value="${escapeHtml(m)}" ${WEEK_MANAGER_FILTER===m?'selected':''}>${escapeHtml(m)}</option>`).join('')}
        </select>
        <input type="text" id="weekSearch" placeholder="이름/사번/매장 검색…" value="${escapeHtml(WEEK_SEARCH)}">
        <span class="count-pill" id="weekCountPill">${emps.length}명</span>
      </div>

      <div class="table-wrap" style="height:520px; overflow:auto;">
        <table>
          <thead><tr>
            <th>상담사</th>
            <th>매장명</th>
            ${weekDates.map(wd => `<th class="${wd.isToday?'wk-today-col':''}">${wd.weekday}<br>${pad2(wd.date.getMonth()+1)}/${pad2(wd.day)}</th>`).join('')}
          </tr></thead>
          <tbody id="weekTbody">${buildWeekTableRowsHtml(weekDates, emps)}</tbody>
        </table>
      </div>
    </div>`;
}

function bindWeeklyScheduleEvents(){
  const prevBtn = document.getElementById('weekPrevBtn');
  const nextBtn = document.getElementById('weekNextBtn');
  if (!prevBtn || !nextBtn) return; // summary panel not the active one / not yet rendered
  prevBtn.addEventListener('click', () => { WEEK_OFFSET -= 1; refreshWeekSection(); });
  nextBtn.addEventListener('click', () => { WEEK_OFFSET += 1; refreshWeekSection(); });
  document.getElementById('weekRegionFilter').addEventListener('change', e => { WEEK_REGION_FILTER = e.target.value; updateWeekBody(); });
  document.getElementById('weekMgrFilter').addEventListener('change', e => { WEEK_MANAGER_FILTER = e.target.value; updateWeekBody(); });
  const searchEl = document.getElementById('weekSearch');
  bindSearchInput(searchEl, val => { WEEK_SEARCH = val; updateWeekBody(); });
}

// week navigation changes the header (date range label + "오늘" highlighted column)
// as well as the body, so it re-renders the whole card — but this is a button click,
// not per-keystroke typing, so it's safe for IME purposes.
function refreshWeekSection(){
  const el = document.getElementById('weekSection');
  if (el) el.outerHTML = renderWeeklyScheduleHtml();
  bindWeeklyScheduleEvents();
}

/* =========================================================================
   TAB: 휴무 한도 설정 (관리자 전용)
   ========================================================================= */
function computeQuotaStatus(sabun, usage){
  const q = QUOTAS[sabun] || {};
  const offQuota = (q.off === undefined || q.off === null || q.off === '') ? null : Number(q.off);
  const subQuota = (q.sub === undefined || q.sub === null || q.sub === '') ? null : Number(q.sub);
  const offUsed = usage.offUsed;
  const subUsed = usage.substituteUsed;
  const annualUsed = usage.annualUsed;
  const subBreakdown = usage.subBreakdown || {sub:0, comp:0};
  return {
    offQuota, subQuota, offUsed, subUsed, annualUsed, subBreakdown,
    offRemaining: offQuota==null ? null : Math.round((offQuota - offUsed)*10)/10,
    subRemaining: subQuota==null ? null : Math.round((subQuota - subUsed)*10)/10,
  };
}

function buildQuotaRowsHtml(emps){
  return emps.map(e => {
    const q = QUOTAS[e.sabun] || {};
    const bd = e.usage.subBreakdown || {sub:0, comp:0};
    return `
    <tr>
      <td>${escapeHtml(e.name)}</td>
      <td class="mono">${escapeHtml(e.sabun)}</td>
      <td>${escapeHtml(e.store)}</td>
      <td>${escapeHtml(e.manager)}</td>
      <td class="mono">${e.usage.offUsed}일</td>
      <td><input type="number" min="0" step="0.5" class="quota-input" data-sabun="${escapeHtml(e.sabun)}" data-field="off" value="${q.off ?? ''}" placeholder="한도"></td>
      <td class="mono">${e.usage.substituteUsed}일</td>
      <td><input type="number" min="0" step="0.5" class="quota-input" data-sabun="${escapeHtml(e.sabun)}" data-field="sub" value="${q.sub ?? ''}" placeholder="한도"></td>
      <td class="mono" style="color:#1D7A9C;">${bd.sub}일</td>
      <td class="mono" style="color:#6B4FC7;">${bd.comp}일</td>
      <td class="mono">${e.usage.annualUsed}일</td>
    </tr>`;
  }).join('') || '<tr><td colspan="11" style="text-align:center;color:var(--muted);">검색 결과가 없습니다</td></tr>';
}

function getQuotaFilteredEmps(){
  const a = ANALYSIS;

    const q = normName(search).toLowerCase();
    emps = emps.filter(e => normName(e.name).toLowerCase().includes(q) || e.sabun.toLowerCase().includes(q) || normName(e.store).toLowerCase().includes(q));
  }
  return emps;
}

    targetEmps.forEach(e => {

      if (offVal !== '') QUOTAS[e.sabun].off = Number(offVal);
      if (subVal !== '') QUOTAS[e.sabun].sub = Number(subVal);
    });
    updateQuotaBody();
    const btn = document.getElementById('quotaSaveBtn');
    if (btn){ btn.disabled = true; btn.textContent = '저장 중…'; }
    await saveSharedData(true);
    if (btn){ btn.disabled = false; btn.textContent = '💾 저장 & 공유 반영'; }
    renderEmployeeTab();
    showNotice(`${targetEmps.length}명에게 일괄 적용하고 저장했습니다.`, 'info');
  });

  document.getElementById('quotaDownloadBtn').addEventListener('click', exportQuotaExcel);

  const uploadInput = document.getElementById('quotaUploadInput');
  document.getElementById('quotaUploadBtn').addEventListener('click', () => uploadInput.click());
  uploadInput.addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    await importQuotaExcel(file);
  });

  document.getElementById('quotaSaveBtn').addEventListener('click', async () => {
    const btn = document.getElementById('quotaSaveBtn');
    btn.disabled = true; btn.textContent = '저장 중…';
    await saveSharedData();
    renderEmployeeTab();
    btn.disabled = false; btn.textContent = '💾 저장 & 공유 반영';
  });
}

function exportQuotaExcel(){
  const a = ANALYSIS;
  const rows = a.employees.slice().sort((x,y)=>x.name.localeCompare(y.name,'ko')).map(e => {
    const q = QUOTAS[e.sabun] || {};
    return {
      사번: e.sabun, 이름: e.name, 매장: e.store, 담당자: e.manager,
      휴무사용일수: e.usage.offUsed, 휴무한도: q.off ?? '',
      대체휴무사용일수: e.usage.substituteUsed, 대체휴무한도: q.sub ?? '',
      연차사용일수_참고용: e.usage.annualUsed,
    };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), '휴무한도입력');
  XLSX.writeFile(wb, `제니엘_휴무한도_${a.year}${pad2(a.month)}.xlsx`);
}

async function importQuotaExcel(file){
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const sn = wb.SheetNames[0];
    const rows = sheetToRows(wb.Sheets[sn]);
    const hIdx = findHeaderRow(rows, ['사번']);
    if (hIdx === -1){
      showNotice('업로드한 파일에서 "사번" 열을 찾지 못했습니다. 다운로드한 양식을 그대로 사용해주세요.', 'warn');
      return;
    }
    const header = rows[hIdx].map(cellToStr);
    const col = buildColMap(header);
    const findCol = names => names.map(n => col[n]).find(v => v !== undefined);
    const sabunIdx = findCol(['사번']);
    const offIdx = findCol(['휴무한도','휴무 한도']);
    const subIdx = findCol(['대체휴무한도','대체휴무 한도']);
    if (offIdx === undefined && subIdx === undefined){
      showNotice('업로드한 파일에서 "휴무한도" 또는 "대체휴무한도" 열을 찾지 못했습니다.', 'warn');
      return;
    }
    const knownSabuns = new Set(ANALYSIS.employees.map(e=>e.sabun));
    let updated = 0, skipped = 0;
    for (let r=hIdx+1; r<rows.length; r++){
      const row = rows[r];
      const sabun = cellToStr(row[sabunIdx]);
      if (!sabun) continue;
      if (!knownSabuns.has(sabun)){ skipped++; continue; }
      if (!QUOTAS[sabun]) QUOTAS[sabun] = {};
      if (offIdx !== undefined){
        const v = cellToStr(row[offIdx]);
        if (v !== '') QUOTAS[sabun].off = Number(v);
      }
      if (subIdx !== undefined){
        const v = cellToStr(row[subIdx]);
        if (v !== '') QUOTAS[sabun].sub = Number(v);
      }
      updated++;
    }
    updateQuotaBody();
    await saveSharedData(true);
    renderEmployeeTab();
    showNotice(`엑셀에서 ${updated}명 반영, ${skipped}명은 현재 분석 대상에 없어 건너뛰었습니다. 저장까지 완료됐습니다.`, 'info');
  } catch(err){
    console.error(err);
    showNotice('휴무한도 엑셀을 읽는 중 오류가 발생했습니다: ' + (err.message||err), 'warn');
  }
}

  const a = ANALYSIS;

  if (LEAVE_FILTERS.date!=='전체') filtered = filtered.filter(x=>x.date===LEAVE_FILTERS.date);
  if (LEAVE_FILTERS.status!=='전체') filtered = filtered.filter(x=>x.status===LEAVE_FILTERS.status);

/* =========================================================================
   EXCEL EXPORT
   ========================================================================= */
function isoStrFromDate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

// weekly (Mon–Sun) 휴무/대체휴일/보상휴가/연차/반차 breakdown per counselor, in the style
// of the reference "휴무 초과 확인" report — 3 days/week is that report's own threshold
// convention, kept here for consistency, and clearly labeled as such.
function buildWeeklyOffExcessRows(a){
  const OFF_WEEK_THRESHOLD = 3;
  const firstDay = isoToDateObj(isoFromParts(a.year, a.month, 1));
  const lastDay = isoToDateObj(isoFromParts(a.year, a.month, a.daysInMonth));
  const weeks = [];
  let ws = mondayOf(firstDay);
  while (ws <= lastDay){
    const we = new Date(ws); we.setDate(we.getDate()+6);
    weeks.push({start:new Date(ws), end:we});
    ws = new Date(ws); ws.setDate(ws.getDate()+7);
  }
  const rows = [];
  weeks.forEach(w => {
    a.employees.forEach(e => {
      let off=0, sub=0, comp=0, annual=0, half=0;
      const details = [];
      for (let dt=new Date(w.start); dt<=w.end; dt.setDate(dt.getDate()+1)){
        if (dt.getFullYear()!==a.year || (dt.getMonth()+1)!==a.month) continue;
        const dayRec = e.days.find(d=>d.day===dt.getDate());
        if (!dayRec) continue;
        const code = (dayRec.planCode||'').trim();
        if (!code) continue;
        let bucket = null;
        if (code === '휴무'){ off+=1; bucket='휴무'; }
        else if (code === '대체휴일(1일)'){ sub+=1; bucket='대체휴무'; }
        else if (code === '대체휴일(0.5일)'){ sub+=0.5; bucket='대체휴무0.5'; }
        else if (code === '보상휴가(1일)'){ comp+=1; bucket='보상휴가'; }
        else if (code === '보상휴가(0.5일)'){ comp+=0.5; bucket='보상휴가0.5'; }
        else if (code === '연차'){ annual+=1; bucket='연차'; }
        else if (code === '오전반차' || code === '오후반차'){ half+=0.5; bucket='반차0.5'; }
        if (bucket) details.push(`${isoStrFromDate(dt)} ${bucket}(${code})`);
      }
      const total = off+sub+comp+annual+half;
      if (total <= 0) return;
      rows.push({
        구분:'CE', 이름:e.name, 사번:e.sabun, 점포:e.store, 지역장:e.regionHead, 담당자:e.manager,
        주차기간:`${isoStrFromDate(w.start)}~${isoStrFromDate(w.end)}`,
        휴무:off, 대체휴일:sub, 보상휴가:comp, 연차:annual, 반차:half, 합계:total,
        판정: total>OFF_WEEK_THRESHOLD ? `${OFF_WEEK_THRESHOLD}일 초과` : '정상',
        상세내용: details.join(' / '),
      });
    });
  });
  return rows;
}

      지역장:x.regionHead, 담당자:x.manager, 스케줄:x.planCode||'(미입력)', 판정:x.judgementLabel,

  const leaveRows = a.leaveDaily.map(x => ({

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(orgRows), '조직현황');

  // 5-1. 휴무 한도 현황
  const quotaRows = a.employees.map(e => {
    const qs = computeQuotaStatus(e.sabun, e.usage);
    return {
      이름:e.name, 사번:e.sabun, 매장:e.store, 담당자:e.manager,
      휴무사용:qs.offUsed, 휴무한도: qs.offQuota==null?'미설정':qs.offQuota,

      대체휴무사용_합계:qs.subUsed, 대체휴일사용:qs.subBreakdown.sub, 보상휴가사용:qs.subBreakdown.comp,
      대체휴무한도: qs.subQuota==null?'미설정':qs.subQuota,
      대체휴무잔여초과: qs.subQuota==null?'':(qs.subRemaining<0?`초과 ${Math.abs(qs.subRemaining)}`:`잔여 ${qs.subRemaining}`),
      연차사용_참고용: qs.annualUsed,
    };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(quotaRows), '휴무한도현황');

  // 6. 참고: 미매칭/제외
  const noteRows = [];
  a.unmatchedStores.forEach(s => noteRows.push({구분:'매장매칭실패', 내용:s}));
  a.ghostSabuns.forEach(s => noteRows.push({구분:'근무계획표 미등록 인원', 내용:s.split('|')[1]+' ('+s.split('|')[0]+')'}));
  a.leaveDropped.forEach(x => noteRows.push({구분:'연차신청 제외(대기/승인아님)', 내용:`${x.name} ${x.sabun} ${x.status} ${x.start}`}));
  if (noteRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(noteRows), '참고_제외내역');

  const fname = `제니엘_상담사_근태분석_${a.year}${pad2(a.month)}_기준${a.cutoffIso.replace(/-/g,'')}.xlsx`;
  XLSX.writeFile(wb, fname);
}

/* =========================================================================
   TAB: 이상현황
   ========================================================================= */
function getFilteredAnomalies(){
  const a = ANALYSIS;
  let filtered = a.anomalies.slice();
  if (ANOMALY_FILTERS.date!=='전체') filtered = filtered.filter(x=>x.date===ANOMALY_FILTERS.date);
  if (ANOMALY_FILTERS.type!=='전체') filtered = filtered.filter(x=>x.judgement===ANOMALY_FILTERS.type);
  if (ANOMALY_FILTERS.region!=='전체') filtered = filtered.filter(x=>x.regionHead===ANOMALY_FILTERS.region);
  if (ANOMALY_FILTERS.manager!=='전체') filtered = filtered.filter(x=>x.manager===ANOMALY_FILTERS.manager);
  if (ANOMALY_FILTERS.q){
    const q = normName(ANOMALY_FILTERS.q).toLowerCase();
    filtered = filtered.filter(x => normName(x.name).toLowerCase().includes(q) || x.sabun.toLowerCase().includes(q) || normName(x.store).toLowerCase().includes(q));
  }
  filtered.sort((x,y)=> y.date.localeCompare(x.date) || STATUS_META[y.judgement].severity - STATUS_META[x.judgement].severity);
  return filtered;
}

function buildAnomalyRowsHtml(filtered){
  return filtered.slice(0,800).map(x => `
    <tr>
      <td class="mono">${escapeHtml(x.date)} (${escapeHtml(x.weekday)})</td>
      <td>${escapeHtml(x.name)}</td>
      <td class="mono">${escapeHtml(x.sabun)}</td>
      <td>${escapeHtml(x.store)}</td>
      <td>${escapeHtml(x.regionHead)}</td>
      <td>${escapeHtml(x.manager)}</td>
      <td>${escapeHtml(x.planCode)||'-'}</td>
      <td class="mono">${escapeHtml(x.actualIn)||'-'}</td>
      <td>${x.leaveStatus?`<span class="tag tag-status-${escapeHtml(x.leaveStatus.split(',')[0])}">${escapeHtml(x.leaveStatus)}</span>`:'-'}</td>
      <td><span class="tag ${STATUS_META[x.judgement].cls}">${escapeHtml(x.judgementLabel)}</span></td>
    </tr>`).join('') || '<tr><td colspan="10" style="text-align:center;color:var(--muted);">조건에 맞는 이상 내역이 없습니다</td></tr>';
}

// Only touches table body/count/overflow note — #anomSearch is never removed from
// the DOM, so Korean (or any IME) composition can't be interrupted mid-typing.
function updateAnomalyBody(){
  const filtered = getFilteredAnomalies();
  const tbody = document.getElementById('anomTbody');
  if (tbody) tbody.innerHTML = buildAnomalyRowsHtml(filtered);
  const pill = document.getElementById('anomCountPill');
  if (pill) pill.textContent = `${filtered.length}건`;
  const note = document.getElementById('anomOverflowNote');
  if (note) note.innerHTML = filtered.length>800 ? `<p class="section-sub">상위 800건만 표시됩니다. 전체 내역은 엑셀 다운로드를 이용하세요. (총 ${filtered.length}건)</p>` : '';
}

/* =========================================================================
   TAB: 상담사별 상세 (캘린더)

function renderEmployeeTab(){
  const a = ANALYSIS;
  const managers = Array.from(new Set(a.employees.map(e=>e.manager))).sort((x,y)=>x.localeCompare(y,'ko'));
  let scopedEmployees = a.employees.filter(e => EMP_MANAGER_FILTER==='전체' || e.manager===EMP_MANAGER_FILTER);
  if (!scopedEmployees.length) scopedEmployees = a.employees;
  if (!ACTIVE_EMP || !scopedEmployees.some(e=>e.sabun===ACTIVE_EMP)){
    ACTIVE_EMP = scopedEmployees.length ? scopedEmployees[0].sabun : null;
  }

  const mgrOptions = `<option value="전체">전체 담당자</option>` +
    managers.map(m => `<option value="${escapeHtml(m)}" ${EMP_MANAGER_FILTER===m?'selected':''}>${escapeHtml(m)}</option>`).join('');

  const options = scopedEmployees
    .slice()
    .sort((x,y)=>x.name.localeCompare(y.name,'ko'))
    .map(e => `<option value="${escapeHtml(e.sabun)}" ${e.sabun===ACTIVE_EMP?'selected':''}>${escapeHtml(e.name)} · ${escapeHtml(e.store)} (${escapeHtml(e.sabun)})</option>`)

  const pickerHtml = `
    <div class="employee-picker">

      <select id="empMgrPicker" style="min-width:160px;">${mgrOptions}</select>
      <label style="font-size:11.5px;color:var(--muted);font-weight:600;">상담사 선택</label>
      <select id="empPicker" style="min-width:280px;">${options}</select>
      <input type="text" id="empSearch" placeholder="이름 또는 사번으로 검색…" style="min-width:220px;">
      <span class="count-pill">${scopedEmployees.length}명</span>

    return;

  const legendItems = Object.entries(STATUS_META).map(([k,m]) =>

  // leading blank cells for first day-of-week alignment

  let cells = '';
  for (let i=0;i<firstDow;i++) cells += `<div></div>`;
  emp.days.forEach(d => {
    const meta = dayDisplayMeta(d.judgement, d.planCode);
    const bg = meta.color + '22';
    const timeStr = d.actual ? (d.actual.inTime||d.actual.inTimeChg||'') : '';
    const showPlanLine = d.planCode && d.planCode !== meta.label;
    cells += `<div class="cal-cell" style="background:${bg}; border-color:${meta.color}44;">
      <div class="d">${d.day}<span style="font-weight:400;color:var(--muted);font-size:10px;"> (${d.weekday})</span></div>
      <div class="s" style="color:${meta.color}">${escapeHtml(meta.label)}</div>
      ${showPlanLine ? `<div class="t">계획: ${escapeHtml(d.planCode)}</div>` : ''}
      ${timeStr ? `<div class="t">출근 ${escapeHtml(timeStr)}</div>` : ''}
    </div>`;
  });

  const countsRows = Object.entries(emp.counts)
    .sort((x,y)=>y[1]-x[1])
    .map(([k,v]) => `<div class="item"><div class="k">${escapeHtml(STATUS_META[k].label)}</div><div class="v" style="color:${STATUS_META[k].color}">${v}</div></div>`)
    .join('');

  const empLeaves = a.leaveEnriched.filter(x=>x.sabun===emp.sabun);

    <tr>
      <td class="mono">${escapeHtml(l.applyDate)}</td>
      <td>${escapeHtml(l.start)}${l.start!==l.end?' ~ '+escapeHtml(l.end):''}</td>
      <td>${escapeHtml(l.amount)}</td>
      <td>${escapeHtml(l.kind)}</td>
      <td><span class="tag tag-status-${escapeHtml(l.status)}">${escapeHtml(l.status)}</span></td>
      <td>${escapeHtml(l.reflected)}</td>
      <td class="wrap">${escapeHtml(l.note)}</td>
    </tr>`).join('') : `<tr><td colspan="7" style="color:var(--muted);text-align:center;">연차/휴가 신청 내역이 없습니다</td></tr>`;

  const qs = computeQuotaStatus(emp.sabun, emp.usage);
  const quotaBox = (label, used, quota, remaining, extraHtml) => {
    if (quota == null){
      return `
        <div class="quota-box">
          <div class="quota-label">${label}</div>
          <div class="quota-used">사용 <b>${used}일</b></div>
          ${extraHtml||''}
          <div class="quota-note">한도 미설정</div>
        </div>`;
    }
    const over = remaining < 0;
    return `
      <div class="quota-box">
        <div class="quota-label">${label}</div>
        <div class="quota-used">사용 <b>${used}일</b> / 한도 ${quota}일</div>
        ${extraHtml||''}
        <div class="quota-remain ${over?'over':'ok'}">${over ? `초과 ${Math.abs(remaining)}일` : `잔여 ${remaining}일`}</div>
      </div>`;
  };
  const subBreakdownHtml = `<div class="quota-note">대체휴일 <b style="color:#1D7A9C">${qs.subBreakdown.sub}일</b> + 보상휴가 <b style="color:#6B4FC7">${qs.subBreakdown.comp}일</b></div>`;
  const annualBox = `
    <div class="quota-box">
      <div class="quota-label">연차 <span style="font-weight:400;color:var(--muted);">(참고용)</span></div>
      <div class="quota-used">사용 <b>${qs.annualUsed}일</b></div>
      <div class="quota-note">한도 설정 없이 사용일수만 표시합니다</div>
    </div>`;
  const absentColor = STATUS_META.absent_unauth.color;
  const absentCount = emp.counts['absent_unauth'] || 0;
  const absentBox = `
    <div class="quota-box" style="border-color:${absentColor}55; background:${absentColor}0F;">
      <div class="quota-label" style="color:${absentColor};">결근(미입력)</div>
      <div class="quota-used">이번 달 <b style="color:${absentColor};">${absentCount}일</b></div>
      <div class="quota-note">일자별 캘린더의 <span style="color:${absentColor};font-weight:700;">●</span> 결근 표시와 같은 항목입니다</div>
    </div>`;
  const quotaCardHtml = `
    <div class="panel-card">
      <h3>휴무 한도 현황 (${a.year}년 ${a.month}월)</h3>
      <div class="quota-grid">
        ${quotaBox('휴무', qs.offUsed, qs.offQuota, qs.offRemaining)}
        ${absentBox}
        ${quotaBox('대체휴무', qs.subUsed, qs.subQuota, qs.subRemaining, subBreakdownHtml)}
        ${annualBox}
      </div>
      ${(qs.offQuota==null || qs.subQuota==null) ? '<p class="section-sub" style="margin-top:10px;">한도가 설정되지 않은 항목은 관리자 로그인 → "휴무 한도 설정" 탭에서 입력할 수 있습니다.</p>' : ''}
    </div>`;

  document.getElementById('panel-employee').innerHTML = `
    ${pickerHtml}
    <div class="emp-summary-card">
      <div class="row">
        <div class="item"><div class="k">이름</div><div class="v">${escapeHtml(emp.name)}</div></div>
        <div class="item"><div class="k">사번</div><div class="v mono">${escapeHtml(emp.sabun)}</div></div>
        <div class="item"><div class="k">매장</div><div class="v">${escapeHtml(emp.store)}</div></div>
        <div class="item"><div class="k">경로</div><div class="v">${escapeHtml(emp.route)||'-'}</div></div>
        <div class="item"><div class="k">지역장</div><div class="v">${escapeHtml(emp.regionHead)}</div></div>
        <div class="item"><div class="k">매니저</div><div class="v">${escapeHtml(emp.manager)}</div></div>
      </div>
    </div>

    ${quotaCardHtml}

    <div class="panel-card">
      <h3>${a.year}년 ${a.month}월 판정 요약</h3>
      <div class="emp-summary-card" style="border:none;padding:0;">
        <div class="row">${countsRows}</div>
      </div>
    </div>

    <div class="panel-card">
      <h3>일자별 캘린더</h3>
      <div class="cal-legend">${legendItems}</div>
      <div class="cal-grid" style="grid-template-columns:repeat(7,1fr); margin-bottom:6px;">
        ${WEEKDAYS_KR.map(w=>`<div style="text-align:center;font-size:11px;font-weight:700;color:var(--muted);">${w}</div>`).join('')}
      </div>
      <div class="cal-grid">${cells}</div>
    </div>

    <div class="panel-card">
      <h3>연차/휴가 신청 내역 (대기·승인)</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>신청일</th><th>휴가기간</th><th>사용갯수</th><th>구분</th><th>상태</th><th>스케줄반영</th><th class="wrap">비고</th></tr></thead>
          <tbody>${leaveRows}</tbody>
        </table>
      </div>
    </div>
  `;
  bindEmployeePicker();
}

function bindEmployeePicker(){
  const mgrSel = document.getElementById('empMgrPicker');
  if (mgrSel) mgrSel.addEventListener('change', e => {
    EMP_MANAGER_FILTER = e.target.value;
    ACTIVE_EMP = null; // force re-pick within new scope
    renderEmployeeTab();
  });
  const sel = document.getElementById('empPicker');
  if (sel) sel.addEventListener('change', e => { ACTIVE_EMP = e.target.value; renderEmployeeTab(); });
  const search = document.getElementById('empSearch');
  if (search) bindSearchInput(search, raw => {
    const q = normName(raw).toLowerCase();
    if (!q) return;
    const match = ANALYSIS.employees.find(x => normName(x.name).toLowerCase().includes(q) || x.sabun.toLowerCase().includes(q));
    if (match && match.sabun !== ACTIVE_EMP){
      ACTIVE_EMP = match.sabun;
      EMP_MANAGER_FILTER = '전체'; // search can find anyone regardless of the manager filter
      renderEmployeeTab();
      const s2 = document.getElementById('empSearch');
      if (s2){ s2.value = raw; s2.focus(); s2.setSelectionRange(raw.length, raw.length); }
    }
  });
}

/* =========================================================================
   TAB: 조직현황
   ========================================================================= */
function renderOrg(){
  const a = ANALYSIS;
  const filterHtml = `
    <div class="filter-row">
      <span class="badge" style="background:var(--accent-soft);color:var(--accent);border:1px solid #BFE0D5;">경로 · 전자랜드만 표시</span>
      <span class="count-pill" id="orgCountPill"></span>
    </div>`;

  const filtered = a.employees;

  // group: regionHead -> manager -> [employees]
  const tree = new Map();
  filtered.forEach(e => {
    const head = e.regionHead || '미매칭';
    if (!tree.has(head)) tree.set(head, new Map());
    const mgrMap = tree.get(head);
    const mgr = e.manager || '미매칭';
    if (!mgrMap.has(mgr)) mgrMap.set(mgr, []);
    mgrMap.get(mgr).push(e);
  });

  let html = filterHtml;
  Array.from(tree.entries()).sort((x,y)=>x[0].localeCompare(y[0],'ko')).forEach(([head, mgrMap]) => {
    const headCount = Array.from(mgrMap.values()).reduce((s,arr)=>s+arr.length,0);
    const headAnomalies = a.anomalies.filter(x => (x.regionHead||'미매칭')===head).length;
    html += `<div class="org-region">
      <div class="org-region-head">
        <span>🧭 ${escapeHtml(head)} <span style="font-weight:500;color:var(--muted);">지역장</span></span>
        <span class="stat">${headCount}명 · 이상 ${headAnomalies}건</span>
      </div>
      <div class="org-manager">`;
    Array.from(mgrMap.entries()).sort((x,y)=>x[0].localeCompare(y[0],'ko')).forEach(([mgr, emps], idx) => {
      const mgrId = `org_${normName(head)}_${normName(mgr)}_${idx}`.replace(/[^a-zA-Z0-9가-힣_]/g,'');
      const mgrAnomalies = a.anomalies.filter(x => (x.manager||'미매칭')===mgr && (x.regionHead||'미매칭')===head).length;
      const stores = Array.from(new Set(emps.map(e=>e.store)));
      html += `<div class="org-manager-row" data-target="${mgrId}">
        <span class="chev">▶</span>
        <span class="name">${escapeHtml(mgr)}</span>
        <span class="meta">매니저 · 매장 ${stores.length}개</span>
        <span class="spacer"></span>
        <span class="meta">${emps.length}명 · 이상 ${mgrAnomalies}건</span>
      </div>
      <div class="org-ce-list" id="${mgrId}">
        ${emps.map(e => {
          const empAnomalies = e.days.filter(d=>STATUS_META[d.judgement].severity>=1).length;
          const dotColor = empAnomalies>0 ? 'var(--danger)' : 'var(--accent)';
          return `<span class="org-ce-chip" data-sabun="${escapeHtml(e.sabun)}"><span class="dot" style="background:${dotColor}"></span>${escapeHtml(e.name)} <span style="color:var(--muted)">· ${escapeHtml(e.store)}${empAnomalies?` · 이상${empAnomalies}`:''}</span></span>`;
        }).join('')}
      </div>`;
    });
    html += `</div></div>`;
  });

  document.getElementById('panel-org').innerHTML = html || '<div class="empty-state"><div class="big">표시할 데이터가 없습니다</div></div>';
  document.getElementById('orgCountPill').textContent = `${filtered.length}명 표시 중`;

  document.querySelectorAll('.org-manager-row').forEach(row => {
    row.addEventListener('click', () => {
      row.classList.toggle('open');
      document.getElementById(row.dataset.target).classList.toggle('open');
    });
  });
  document.querySelectorAll('.org-ce-chip').forEach(chip => {
    chip.addEventListener('click', (ev) => {
      ev.stopPropagation();
      ACTIVE_EMP = chip.dataset.sabun;
      EMP_MANAGER_FILTER = '전체';
      document.querySelector('.tab-btn[data-tab="employee"]').click();
      renderEmployeeTab();
    });
  });
}

   FILE UPLOAD HANDLING
